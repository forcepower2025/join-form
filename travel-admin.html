<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊報名管理</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: #f5f7fb;
    }

    .login-bar {
      background: #222;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .login-bar input {
      width: 180px;
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
    }

    .login-bar button {
      padding: 8px 16px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #1f6feb;
      color: white;
      cursor: pointer;
    }

    .container {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    input, select {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
      font-size: 15px;
    }

    th {
      background: #333;
      color: #fff;
    }

    td.editable {
      cursor: pointer;
      background: #fffdf0;
    }

    .pay-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .paid {
      background: #1f6feb;
    }

    .unpaid {
      background: #d93025;
    }

    .msg {
      margin: 12px 0;
      font-weight: bold;
      text-align: center;
    }

    @media (max-width: 768px) {
      .filters {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 14px;
        min-width: 900px;
      }

      .table-wrap {
        overflow-x: auto;
      }
    }

    .check-filter {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      margin: 12px 0 16px;
    }

    .check-item {
      display: flex;
      align-items: center;
      flex-direction: row-reverse;
      gap: 12px;
      font-size: 22px;
      font-weight: bold;
    }

    .check-item input[type="checkbox"] {
      width: 34px;
      height: 34px;
      cursor: pointer;
    }

    .summary-box {
      text-align: center;
      margin: 12px 0 20px;
      line-height: 1.8;
      font-size: 18px;
      color: #555;
    }

    .summary-box span {
      font-weight: bold;
      color: #000;
    }

    .reload-btn {
      font-size: 20px;
      font-weight: 300;
      padding: 5px 24px;
      border-radius: 10px;
    }

    .delete-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 12px 0 20px;
      flex-wrap: wrap;
    }

    .delete-area span {
      font-size: 18px;
      font-weight: bold;
    }

    .delete-area input {
      width: 100px;
      padding: 10px 14px;
      font-size: 18px;
    }

    .delete-submit-btn {
      background: #222;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
 
</head>

<body>

<div class="login-bar">
  <input
    type="password"
    id="adminPassword"
    placeholder="請輸入密碼"
  >

  <button onclick="checkPassword()">
    進入後台
  </button>
</div>

<div
  class="container"
  id="adminContent"
  style="display:none;"
>

  <h1>
    2026-5-30<br>
    動元力國際<br>
    旅遊報名管理
  </h1>

  <div class="summary-box">
    <div>目前報名：<span id="totalCount">0</span> 人</div>
    <div>已繳費：<span id="paidCount">0</span> 人</div>
    <div>未繳費：<span id="unpaidCount">0</span> 人</div>
  </div>

  <div class="filters">
    <input type="text" id="filterName" placeholder="篩選姓名">
    <input type="text" id="filterReferrer" placeholder="篩選介紹人">
    <input type="text" id="filterLeader" placeholder="篩選團隊長">

    <div class="check-filter">
      <label class="check-item">
        <input type="checkbox" id="filterPaid">
        <span>已繳費</span>
      </label>

      <label class="check-item">
        <input type="checkbox" id="filterUnpaid">
        <span>未繳費</span>
      </label>
    </div>

    <div class="delete-area">
      <span>刪除資料：</span>

      <input
        type="text"
        id="deleteName"
        placeholder="輸入姓名"
      >

      <button
        class="delete-submit-btn"
        onclick="deleteByName()">
        送出刪除
      </button>
    </div>

    <button class="reload-btn" onclick="downloadPDF()">
      下載表格
    </button>

    <button class="reload-btn" onclick="loadData()">
      重新整理
    </button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>姓名</th>
          <th>手機號碼</th>
          <th>身份證字號</th>
          <th>出生年月日</th>
          <th>介紹人</th>
          <th>團隊長</th>
          <th>是否已繳費</th>
        </tr>
      </thead>

      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>
const ADMIN_PASSWORD = '60398346';

const API_URL =
'https://script.google.com/macros/s/AKfycbxFbheZOQVYMRE3LgZEujHHyY4ZaiyY_JYM9aeFM05V83aVxi_k5GA9iTuD6pUsAVsfUA/exec';

let allData = [];

function checkPassword() {
  const password =
    document.getElementById('adminPassword').value;

  if (password === ADMIN_PASSWORD) {
    document.getElementById('adminContent')
      .style.display = 'block';

    loadData();
  } else {
    alert('密碼錯誤');
  }
}

async function api(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  });

  return await res.json();
}

async function loadData() {
  const msg = document.getElementById('msg');

  msg.textContent = '資料載入中...';

  try {
    const result = await api({
      action: 'list'
    });

    if (result.success) {
      allData = result.data || [];
      render();
      msg.textContent = '';
    } else {
      msg.textContent =
        result.message || '資料載入失敗';
    }
  } catch (err) {
    msg.textContent = '資料載入失敗';
  }
}

function render() {
  const tbody =
    document.getElementById('tbody');

  tbody.innerHTML = '';

  const name =
    document.getElementById('filterName')
    .value
    .trim();

  const referrer =
    document.getElementById('filterReferrer')
    .value
    .trim();

  const leader =
    document.getElementById('filterLeader')
    .value
    .trim();

  const filterPaid =
    document.getElementById('filterPaid')
    .checked;

  const filterUnpaid =
    document.getElementById('filterUnpaid')
    .checked;

  const totalCount = allData.length;

  const paidCount = allData.filter(
    item => item.paymentStatus === '已繳費'
  ).length;

  const unpaidCount = allData.filter(
    item => item.paymentStatus !== '已繳費'
  ).length;

  document.getElementById('totalCount')
    .textContent = totalCount;

  document.getElementById('paidCount')
    .textContent = paidCount;

  document.getElementById('unpaidCount')
    .textContent = unpaidCount;

  const filtered = allData.filter(item => {
    return (
      (!name || item.name.includes(name)) &&
      (!referrer || item.referrer.includes(referrer)) &&
      (!leader || item.leader.includes(leader)) &&
      (
        (!filterPaid && !filterUnpaid) ||
        (filterPaid && item.paymentStatus === '已繳費') ||
        (filterUnpaid && item.paymentStatus === '未繳費')
      )
    );
  });

  filtered.forEach(item => {
    const tr = document.createElement('tr');

    tr.innerHTML = `
      ${editableTd(item, 'name', item.name)}
      ${editableTd(item, 'phone', item.phone)}
      ${editableTd(item, 'idNumber', item.idNumber)}
      ${editableTd(item, 'birthDate', item.birthDate)}
      ${editableTd(item, 'referrer', item.referrer)}
      ${editableTd(item, 'leader', item.leader)}
      <td>
        <button
          class="pay-btn ${item.paymentStatus === '已繳費' ? 'paid' : 'unpaid'}"
          onclick="togglePayment(
            ${item.rowNumber},
            '${escapeQuote(item.name)}',
            '${item.paymentStatus}'
          )">
          ${item.paymentStatus || '未繳費'}
        </button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

function editableTd(item, field, value) {
  return `
    <td
      class="editable"
      onclick="editField(
        ${item.rowNumber},
        '${field}',
        '${escapeQuote(value)}'
      )">
      ${value || ''}
    </td>
  `;
}

async function editField(
  rowNumber,
  field,
  oldValue
) {
  const newValue =
    prompt('請輸入新的內容：', oldValue);

  if (newValue === null) return;

  try {
    const result = await api({
      action: 'updateField',
      rowNumber,
      field,
      value: newValue
    });

    if (result.success) {
      await loadData();
    } else {
      alert(result.message || '更新失敗');
    }
  } catch (err) {
    alert('更新失敗');
  }
}

async function togglePayment(
  rowNumber,
  name,
  currentStatus
) {
  const newStatus =
    currentStatus === '已繳費'
      ? '未繳費'
      : '已繳費';

  const ok = confirm(
    `是否確認把${name}改成${newStatus}?`
  );

  if (!ok) return;

  try {
    const result = await api({
      action: 'updatePayment',
      rowNumber,
      status: newStatus
    });

    if (result.success) {
      await loadData();
    } else {
      alert(result.message || '更新失敗');
    }
  } catch (err) {
    alert('更新失敗');
  }
}

async function deleteByName() {
  const name =
    document.getElementById('deleteName')
    .value
    .trim();

  if (!name) {
    alert('請輸入姓名');
    return;
  }

  const ok = confirm(
    `是否確認刪除 ${name} 的資料？`
  );

  if (!ok) return;

  try {
    const result = await api({
      action: 'deleteByName',
      name
    });

    if (result.success) {
      alert(
        `已刪除 ${result.deletedCount} 筆資料`
      );

      document.getElementById('deleteName')
        .value = '';

      await loadData();
    } else {
      alert(result.message || '刪除失敗');
    }
  } catch (err) {
    alert('刪除失敗');
  }
}

function escapeQuote(str) {
  return String(str || '')
    .replace(/'/g, "\\'");
}

document.getElementById('filterName')
  .addEventListener('input', render);

document.getElementById('filterReferrer')
  .addEventListener('input', render);

document.getElementById('filterLeader')
  .addEventListener('input', render);

document.getElementById('filterPaid')
  .addEventListener('change', render);

document.getElementById('filterUnpaid')
  .addEventListener('change', render);

async function downloadPDF() {

  const { jsPDF } = window.jspdf;

  const pdf =
    new jsPDF('l', 'mm', 'a4');

  const rowsPerPage = 10;

  const allRows =
    Array.from(
      document.querySelectorAll('tbody tr')
    );

  const totalPages =
    Math.ceil(
      allRows.length / rowsPerPage
    );

  for (
    let page = 0;
    page < totalPages;
    page++
  ) {

    const start =
      page * rowsPerPage;

    const end =
      start + rowsPerPage;

    const pageRows =
      allRows.slice(start, end);

    const tempTable =
      document.createElement('table');
      tempTable.style.width = '1400px';
      tempTable.style.tableLayout = 'fixed';

    tempTable.style.width = '100%';
    tempTable.style.fontSize = '30px';
    tempTable.style.borderCollapse = 'collapse';
    tempTable.style.background = '#fff';

    tempTable.innerHTML = `
      <thead>
        <tr>
          <th>姓名</th>
          <th>手機號碼</th>
          <th>身份證字號</th>
          <th>出生年月日</th>
          <th>介紹人</th>
          <th>團隊長</th>
          <th>是否已繳費</th>
        </tr>
      </thead>
    `;

    const tbody =
      document.createElement('tbody');

    pageRows.forEach(tr => {
      tbody.appendChild(
        tr.cloneNode(true)
      );
    });

    tempTable.appendChild(tbody);

    tempTable.style.position = 'fixed';
    tempTable.style.left = '-99999px';

    document.body.appendChild(tempTable);
    tempTable.querySelectorAll('th, td')
  .forEach(el => {

    el.style.fontSize = '30px';

    el.style.padding = '18px';

    el.style.whiteSpace = 'nowrap';

  });

    tempTable.querySelectorAll('button')
  .forEach(btn => {

    btn.style.fontSize = '32px';

    btn.style.padding = '12px 20px';

  });
    
const canvas =
  await html2canvas(tempTable, {
    scale: 3,
    windowWidth: 1400,
    width: 1400
  });

    document.body.removeChild(tempTable);

    const imgData =
      canvas.toDataURL('image/png');

    const pageWidth =
      pdf.internal.pageSize.getWidth() - 20;

    const imgHeight =
      (canvas.height * pageWidth / canvas.width) ;

    if (page > 0) {
      pdf.addPage();
    }

pdf.addImage(
  imgData,
  'PNG',
  10,
  10,
  pageWidth,
  imgHeight
);
  }

  pdf.save('旅遊報名表.pdf');
}
  
</script>

</body>
</html>
