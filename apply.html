    function checkTaiwanID(id) {
  const letters = "ABCDEFGHJKLMNPQRSTUVXYWZIO";
  const mapping = {
    A:10,B:11,C:12,D:13,E:14,F:15,G:16,H:17,I:34,J:18,
    K:19,L:20,M:21,N:22,O:35,P:23,Q:24,R:25,S:26,T:27,
    U:28,V:29,W:32,X:30,Y:31,Z:33
  };

  if (!/^[A-Z][12]\d{8}$/.test(id)) return false;

  const code = mapping[id[0]];
  let sum = Math.floor(code / 10) + (code % 10) * 9;

  for (let i = 1; i < 9; i++) {
    sum += parseInt(id[i]) * (9 - i);
  }
  sum += parseInt(id[9]);

  return sum % 10 === 0;
}

async function fileToDataUrlWithWatermark(file, text, targetWidth){
  if (!file) return "";

  const srcDataUrl = await fileToDataUrl(file);

  const img = await new Promise((resolve, reject)=>{
    const im = new Image();
    im.onload = ()=> resolve(im);
    im.onerror = reject;
    im.src = srcDataUrl;
  });

  // ✅ 先算等比尺寸（只縮放寬度，height 等比）
  const ow = img.naturalWidth || img.width;
  const oh = img.naturalHeight || img.height;

  const tw = Math.max(1, Number(targetWidth) || ow);  // 沒給就用原寬
  const scale = tw / ow;
  const th = Math.max(1, Math.round(oh * scale));

  const canvas = document.createElement("canvas");
  canvas.width = tw;
  canvas.height = th;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, tw, th);

  const wm = String(text || "").trim();
  if (wm){
    const base = Math.min(canvas.width, canvas.height);
    const fontSize = Math.max(28, Math.floor(base * 0.06));

    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = "#000";
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = Math.max(2, Math.floor(fontSize * 0.08));
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `700 ${fontSize}px sans-serif`;

    const angle = -18 * Math.PI / 180;
    const W = canvas.width;
    const H = canvas.height;

    const padX = Math.max(60, Math.floor(W * 0.18));
    const padY = Math.max(60, Math.floor(H * 0.18));

    const positions = [
      { x: padX,     y: padY     },
      { x: W - padX, y: padY     },
      { x: padX,     y: H - padY },
      { x: W - padX, y: H - padY },
      { x: W / 2,    y: H / 2    },
    ];

    positions.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(angle);
      ctx.strokeText(wm, 0, 0);
      ctx.fillText(wm, 0, 0);
      ctx.restore();
    });

    ctx.restore();
  }

  // ✅ PNG 不吃 0.92 參數，直接輸出 PNG
  return canvas.toDataURL("image/png");
}

    qs("btnClearSign").addEventListener("click", ()=> sig.clear());

    // ===== ✅ 銀行 / 分行搜尋（改成 portal 的 datalist 方式；其餘不動）=====
    let selectedBankCode = "";    // 3碼
    let selectedBranchCode = "";  // 4碼

    function debounce(fn, ms=250){
      let t=null;
      return (...args)=>{
        clearTimeout(t);
        t=setTimeout(()=>fn(...args), ms);
      };
    }

    function pickCodeFromDatalist(listId, inputValue){
      const val = String(inputValue || "").trim();
      if (!val) return "";
      const listEl = qs(listId);
      if (!listEl) return "";
      const opts = listEl.querySelectorAll("option");
      let found = "";
      opts.forEach(op=>{
        if (op.value === val && op.dataset && op.dataset.code) found = op.dataset.code;
      });
      return found;
    }

    // 初始化分行鎖住
    qs("branchNameInput").value = "";
    qs("branchNameInput").disabled = true;
    qs("branchNameInput").placeholder = "請先選擇銀行";
    qs("branchList").innerHTML = "";
    qs("bankList").innerHTML = "";

    // 銀行名稱：輸入 1 字就查（public）
    const onBankInput = debounce(async ()=>{
      const kw = qs("bankNameInput").value.trim();

      // 每次銀行輸入：分行狀態重置
      selectedBranchCode = "";
      qs("branchNameInput").value = "";
      qs("branchNameInput").disabled = true;
      qs("branchNameInput").placeholder = "請先選擇銀行";
      qs("branchList").innerHTML = "";
      qs("bankBranch").value = ""; // 清 7碼

      if (kw.length < 1) {
        qs("bankList").innerHTML = "";
        selectedBankCode = "";
        return;
      }

      const res = await apiCall({ action:"searchBanksPublic", keyword: kw });
      const banks = (res && res.banks) ? res.banks : [];

      qs("bankList").innerHTML = banks.map(b =>
        `<option value="${escapeHtml(b.name)}" data-code="${escapeHtml(b.code)}"></option>`
      ).join("");

      // 若目前輸入值剛好等於清單內某一個銀行名稱 -> 視為已選定並解鎖分行
      const foundCode = pickCodeFromDatalist("bankList", kw);
      if (foundCode) {
        selectedBankCode = foundCode;
        qs("branchNameInput").disabled = false;
        qs("branchNameInput").placeholder = "輸入分行名稱開始搜尋";
      } else {
        selectedBankCode = "";
      }
    }, 250);

    qs("bankNameInput").addEventListener("input", onBankInput);

    // 銀行 change：必須是 datalist 內選到才算選定
    qs("bankNameInput").addEventListener("change", ()=>{
      const val = qs("bankNameInput").value.trim();
      if (!val) return;

      const foundCode = pickCodeFromDatalist("bankList", val);

      if (!foundCode) {
        // 沒從下拉選到（用手打的）-> 視為未選定，分行鎖回去
        selectedBankCode = "";
        selectedBranchCode = "";
        qs("branchNameInput").value = "";
        qs("branchNameInput").disabled = true;
        qs("branchNameInput").placeholder = "請先選擇銀行";
        qs("branchList").innerHTML = "";
        qs("bankBranch").value = "";
        return;
      }

      // 已選定銀行
      selectedBankCode = foundCode;

      // 切換銀行時：清掉分行/7碼
      selectedBranchCode = "";
      qs("branchNameInput").value = "";
      qs("branchList").innerHTML = "";
      qs("bankBranch").value = "";

      // 解鎖分行
      qs("branchNameInput").disabled = false;
      qs("branchNameInput").placeholder = "輸入分行名稱開始搜尋";
      qs("branchNameInput").focus();
    });

    // 分行名稱：必須先選銀行（public）
    const onBranchInput = debounce(async ()=>{
      if (!selectedBankCode) {
        qs("branchNameInput").value = "";
        alert("請先選擇銀行");
        return;
      }

      const kw = qs("branchNameInput").value.trim();
      selectedBranchCode = "";

      if (kw.length < 1) {
        qs("branchList").innerHTML = "";
        return;
      }

      const res = await apiCall({ action:"searchBranchesPublic", bankCode: selectedBankCode, keyword: kw });
      const branches = (res && res.branches) ? res.branches : [];

      qs("branchList").innerHTML = branches.map(br =>
        `<option value="${escapeHtml(br.name)}" data-code="${escapeHtml(br.code)}"></option>`
      ).join("");
    }, 250);

    qs("branchNameInput").addEventListener("input", onBranchInput);

    // 分行 change：選定後回填 7碼
    qs("branchNameInput").addEventListener("change", ()=>{
      const val = qs("branchNameInput").value.trim();
      if (!val || !selectedBankCode) return;

      const foundCode = pickCodeFromDatalist("branchList", val);
      if (!foundCode) return;

      selectedBranchCode = foundCode;

      // ✅ 自動組 7 碼：bankCode(3) + branchCode(4)
      qs("bankBranch").value = `${selectedBankCode}${selectedBranchCode}`;
    });

// ✅ 修改：整段取代 btnSubmit click
qs("btnSubmit").addEventListener("click", async () => {
  try {
    setMsg(msg, "送出中…請稍等資料上傳中…請勿關閉視窗", "ok");

    // ✅ 身分證：大寫 + 檢查
    const idno = qs("idno").value.trim().toUpperCase();
    qs("idno").value = idno;
    if (!checkTaiwanID(idno)) throw new Error("身分證字號不正確");

    // ✅ 年滿 18 歲檢查
   const dobStr = qs("dob").value;
   if (!dobStr) throw new Error("請填寫出生日期");

   const dob = new Date(dobStr);
   const today = new Date();

  // 計算實際年齡（含生日未到的情況）
   let age = today.getFullYear() - dob.getFullYear();
   const m = today.getMonth() - dob.getMonth();
   if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
     age--;
}

if (age < 18) {
  throw new Error("申請人須年滿 18 歲");
}


    // ✅ 簽名必填
    if (sig.isBlank()) throw new Error("必須簽名才能送出申請");

    // ✅ datalist code 補強（避免 change 沒觸發）
    if (!selectedBankCode) {
      selectedBankCode = pickCodeFromDatalist("bankList", qs("bankNameInput").value.trim());
    }
    if (!selectedBranchCode) {
      selectedBranchCode = pickCodeFromDatalist("branchList", qs("branchNameInput").value.trim());
    }
    if (selectedBankCode && selectedBranchCode) {
      qs("bankBranch").value = `${selectedBankCode}${selectedBranchCode}`;
    }

    const wmText = "僅限加入動元力國際";

    // ✅ 存摺檔案（先定義，下面才用得到）
    const bankbookFile = qs("bankbook").files[0];
    const hasBankbook = !!bankbookFile;

    // ✅ 如果有上傳存摺：必填四欄（這段放在 payload 之前）
    if (hasBankbook) {
      const bankNameText = qs("bankNameInput").value.trim();
      const branchNameText = qs("branchNameInput").value.trim();
      const bankAccount = qs("bankAccount").value.trim();
      const bankName = qs("bankName").value.trim();

      if (!bankNameText || !branchNameText || !bankAccount || !bankName) {
        throw new Error("上傳存摺時，銀行名稱 / 分行名稱 / 帳號 / 戶名必須填寫");
      }
    }

    // ✅ payload：物件裡只能放 key/value
    const payload = {
      "姓名": qs("name").value.trim(),
      "加入方案": qs("plan").value,
      "手機號碼": qs("phone").value.trim(),
      "身分證字號": idno,
      "出生日期": qs("dob").value,
      "銀行名稱": qs("bankNameInput").value.trim(),
      "分行名稱": qs("branchNameInput").value.trim(),
      "銀行分行": qs("bankBranch").value.trim(),
      "銀行帳戶": qs("bankAccount").value.trim(),
      "銀行戶名": qs("bankName").value.trim(),
      "通訊地址（縣市）": qs("addrCity").value.trim(),
      "通訊地址（區）": qs("addrDist").value.trim(),
      "通訊地址（詳細地址）": qs("addrDetail").value.trim(),
      "推薦人姓名": qs("refName").value.trim(),
      "推薦人手機號碼": qs("refPhone").value.trim(),

      consentChecked: qs("consent").checked,

      // ✅ 身分證 600px 等比 + 浮水印
      idFrontDataUrl: await fileToDataUrlWithWatermark(qs("idFront").files[0], wmText, 600),
      idBackDataUrl: await fileToDataUrlWithWatermark(qs("idBack").files[0], wmText, 600),

      // ✅ 存摺 600px 等比 + 浮水印（沒選檔就空）
      bankbookDataUrl: await fileToDataUrlWithWatermark(bankbookFile, wmText, 600),

      // ✅ 簽名也加浮水印（要先把canvas轉成圖片再丟進浮水印函式）
      signatureDataUrl: await (async ()=>{
      if (sig.isBlank()) return "";
      const rawSign = sig.toDataUrl();
      const blob = await (await fetch(rawSign)).blob();
      const file = new File([blob], "sign.png", { type:"image/png" });
      return await fileToDataUrlWithWatermark(file, wmText);
      })(),
    };

    // ✅ 基本必填檢核
    if (!payload["姓名"] || !payload["手機號碼"] || !payload["身分證字號"] || !payload["出生日期"]) {
      throw new Error("姓名/手機/身分證/出生日期為必填");
    }
    if (!payload["通訊地址（縣市）"] || !payload["通訊地址（區）"] || !payload["通訊地址（詳細地址）"]) {
      throw new Error("通訊地址需填完整");
    }
    if (!payload.consentChecked) throw new Error("請先勾選同意聲明");

    const res = await apiCall({ action: "submitApplication", payload });
    setMsg(msg, `✅ ${res.message}（手機：${res.phone}）\n你可以使用「手機＋身分證末5碼」登入補件。`, "ok");
  } catch (err) {
    setMsg(msg, `❌ ${String(err?.message || err)}`, "err");
    console.error(err);
  }
});


  </script>
