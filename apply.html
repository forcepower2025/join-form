<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>動元力國際加盟商申請表</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div class="title">動元力國際微股東申請表</div>
        <div class="muted"> 請確實填寫個人資料 
        </div>
      </div>
      <div class="nav">
        <a href="./login.html">登入</a>
      </div>
    </div>

<!-- ✅ 選擇加入方案 -->
<div>
  <label>加入方案</label>
  <select id="plan">
    <option value="">請選擇</option>
    <option value="方案A">方案A - 隔月返還股金</option>
    <option value="方案B">方案B - 三年返還股金</option>
  </select>
</div>

<div id="contractPreview" class="card" style="display:none; margin-top:10px;"></div>


    <div class="card">
      <div class="grid grid-2">
        <div>
          <label>姓名</label>
          <input id="name" placeholder="請輸入姓名" />
        </div>
        <div>
          <label>手機號碼</label>
          <input id="phone" inputmode="numeric" placeholder="例：0912345678" />
        </div>

        <div>
          <label>身分證字號</label>
          <input id="idno" placeholder="例：A123456789" />
          <div class="muted">登入預設密碼為「身分證字號末5碼」</div>
        </div>
        <div>
          <label>出生日期</label>
          <input id="dob" type="date" />
        </div>

        <!-- ✅ 只改這一段：銀行/分行下拉選單樣式改成 portal 的 datalist 方式 -->
        <div>
          <label>銀行名稱</label>
          <input id="bankNameInput" placeholder="輸入 1 個字開始搜尋" list="bankList" autocomplete="off" />
          <datalist id="bankList"></datalist>
        </div>

        <div>
          <label>分行名稱</label>
          <input id="branchNameInput" placeholder="請先選擇銀行" list="branchList" autocomplete="off" disabled />
          <datalist id="branchList"></datalist>
        </div>

        <div>
          <label>銀行代碼與分行代碼(共7碼)</label>
          <input id="bankBranch" placeholder="系統自動帶入" readonly />
        </div>

        <div>
          <label>銀行帳戶</label>
          <input id="bankAccount" placeholder="請輸入帳號" />
        </div>

        <div>
          <label>銀行戶名</label>
          <input id="bankName" placeholder="請輸入戶名" />
        </div>
        <div>
          <label>推薦人姓名</label>
          <input id="refName" placeholder="（可選填）" />
        </div>

        <div>
          <label>推薦人手機號碼</label>
          <input id="refPhone" inputmode="numeric" placeholder="（可選填）" />
        </div>
        <div></div>

        <div>
          <label>通訊地址（縣市）</label>
          <input id="addrCity" placeholder="例：台北市" />
        </div>
        <div>
          <label>通訊地址（區）</label>
          <input id="addrDist" placeholder="例：中正區" />
        </div>
        <div style="grid-column: 1 / -1;">
          <label>通訊地址（詳細地址）</label>
          <input id="addrDetail" placeholder="例：中山北路一段2號" />
        </div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <span class="badge">可選上傳</span>
        <span class="muted">若一開始未上傳，登入後仍可補件。</span>
      </div>
      <div class="grid grid-2" style="margin-top:10px;">
        <div>
          <label>身份證正面</label>
          <input id="idFront" type="file" accept="image/*" />
        </div>
        <div>
          <label>身份證反面</label>
          <input id="idBack" type="file" accept="image/*" />
        </div>
        <div style="grid-column:1/-1;">
          <label>存摺封面</label>
          <input id="bankbook" type="file" accept="image/*" />
        </div>
      </div>
    </div>



    <div class="card">
      <div class="row">
        <span class="badge">同意聲明</span>
      </div>
      <div style="margin-top:10px;">
        <label style="display:flex; gap:10px; align-items:center; color: var(--txt);">
          <input id="consent" type="checkbox" style="width:auto; transform: scale(1.1);" />
          我已閱讀並同意以上合約書內容
        </label>
        <div class="muted">送出即表示同意並以簽名為憑。</div>
      </div>

      <hr />

      <div class="row">
        <span class="badge">手寫簽名</span>
        <button id="btnClearSign" class="btn-ghost" type="button">清除簽名</button>
      </div>
      <div style="margin-top:10px;">
        <canvas id="signCanvas"></canvas>
        <div class="muted">手機可直接手寫；電腦用滑鼠簽名。</div>
      </div>

      <div class="row" style="margin-top:12px;">
        <button id="btnSubmit" class="btn-primary" type="button">送出申請</button>
      </div>

      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script src="./app.js"></script>

  <script>
    const msg = qs("msg");
    const sig = setupSignatureCanvas(qs("signCanvas"));

//====== ✅ 身分證加浮文印 ========
    async function fileToDataUrlWithWatermark(file, text){
  if (!file) return "";

  const srcDataUrl = await fileToDataUrl(file);

  const img = await new Promise((resolve, reject)=>{
    const im = new Image();
    im.onload = ()=> resolve(im);
    im.onerror = reject;
    im.src = srcDataUrl;
  });

  const canvas = document.createElement("canvas");
  canvas.width = img.naturalWidth || img.width;
  canvas.height = img.naturalHeight || img.height;
  const ctx = canvas.getContext("2d");

  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  const wm = String(text || "").trim();
  if (wm){
    const base = Math.min(canvas.width, canvas.height);
    const fontSize = Math.max(28, Math.floor(base * 0.06));

    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = "#000";
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = Math.max(2, Math.floor(fontSize * 0.08));
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `700 ${fontSize}px sans-serif`;

    const angle = -18 * Math.PI / 180;

// ✅ 五個位置：左上、右上、左下、右下、中間（都同角度）
const W = canvas.width;
const H = canvas.height;

// 距離邊緣留白（避免太貼邊被裁切）
const padX = Math.max(60, Math.floor(W * 0.18));
const padY = Math.max(60, Math.floor(H * 0.18));

const positions = [
  { x: padX,     y: padY     }, // 左上
  { x: W - padX, y: padY     }, // 右上
  { x: padX,     y: H - padY }, // 左下
  { x: W - padX, y: H - padY }, // 右下
  { x: W / 2,    y: H / 2    }, // 中間
];

positions.forEach(p => {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(angle);
  ctx.strokeText(wm, 0, 0);
  ctx.fillText(wm, 0, 0);
  ctx.restore();
});

ctx.restore();

  }

  return canvas.toDataURL("image/jpeg", 0.92);
}


// ===== ✅ 設定切換方案時，顯示對應的合約 =====
qs("plan").addEventListener("change", async ()=>{
  const plan = qs("plan").value;
  if(!plan){
    qs("contractPreview").style.display="none";
    qs("contractPreview").innerHTML = "";
    return;
  }

  try{
    const res = await apiCall({ action:"getContractTemplate", plan });
    qs("contractPreview").innerHTML = res.html || "";
    qs("contractPreview").style.display = "";
  }catch(err){
    qs("contractPreview").style.display = "";
    qs("contractPreview").innerHTML = `❌ ${escapeHtml(String(err?.message || err))}`;
  }
});



    qs("btnClearSign").addEventListener("click", ()=> sig.clear());

    // ===== ✅ 銀行 / 分行搜尋（改成 portal 的 datalist 方式；其餘不動）=====
    let selectedBankCode = "";    // 3碼
    let selectedBranchCode = "";  // 4碼

    function debounce(fn, ms=250){
      let t=null;
      return (...args)=>{
        clearTimeout(t);
        t=setTimeout(()=>fn(...args), ms);
      };
    }

    function pickCodeFromDatalist(listId, inputValue){
      const val = String(inputValue || "").trim();
      if (!val) return "";
      const listEl = qs(listId);
      if (!listEl) return "";
      const opts = listEl.querySelectorAll("option");
      let found = "";
      opts.forEach(op=>{
        if (op.value === val && op.dataset && op.dataset.code) found = op.dataset.code;
      });
      return found;
    }

    // 初始化分行鎖住
    qs("branchNameInput").value = "";
    qs("branchNameInput").disabled = true;
    qs("branchNameInput").placeholder = "請先選擇銀行";
    qs("branchList").innerHTML = "";
    qs("bankList").innerHTML = "";

    // 銀行名稱：輸入 1 字就查（public）
    const onBankInput = debounce(async ()=>{
      const kw = qs("bankNameInput").value.trim();

      // 每次銀行輸入：分行狀態重置
      selectedBranchCode = "";
      qs("branchNameInput").value = "";
      qs("branchNameInput").disabled = true;
      qs("branchNameInput").placeholder = "請先選擇銀行";
      qs("branchList").innerHTML = "";
      qs("bankBranch").value = ""; // 清 7碼

      if (kw.length < 1) {
        qs("bankList").innerHTML = "";
        selectedBankCode = "";
        return;
      }

      const res = await apiCall({ action:"searchBanksPublic", keyword: kw });
      const banks = (res && res.banks) ? res.banks : [];

      qs("bankList").innerHTML = banks.map(b =>
        `<option value="${escapeHtml(b.name)}" data-code="${escapeHtml(b.code)}"></option>`
      ).join("");

      // 若目前輸入值剛好等於清單內某一個銀行名稱 -> 視為已選定並解鎖分行
      const foundCode = pickCodeFromDatalist("bankList", kw);
      if (foundCode) {
        selectedBankCode = foundCode;
        qs("branchNameInput").disabled = false;
        qs("branchNameInput").placeholder = "輸入分行名稱開始搜尋";
      } else {
        selectedBankCode = "";
      }
    }, 250);

    qs("bankNameInput").addEventListener("input", onBankInput);

    // 銀行 change：必須是 datalist 內選到才算選定
    qs("bankNameInput").addEventListener("change", ()=>{
      const val = qs("bankNameInput").value.trim();
      if (!val) return;

      const foundCode = pickCodeFromDatalist("bankList", val);

      if (!foundCode) {
        // 沒從下拉選到（用手打的）-> 視為未選定，分行鎖回去
        selectedBankCode = "";
        selectedBranchCode = "";
        qs("branchNameInput").value = "";
        qs("branchNameInput").disabled = true;
        qs("branchNameInput").placeholder = "請先選擇銀行";
        qs("branchList").innerHTML = "";
        qs("bankBranch").value = "";
        return;
      }

      // 已選定銀行
      selectedBankCode = foundCode;

      // 切換銀行時：清掉分行/7碼
      selectedBranchCode = "";
      qs("branchNameInput").value = "";
      qs("branchList").innerHTML = "";
      qs("bankBranch").value = "";

      // 解鎖分行
      qs("branchNameInput").disabled = false;
      qs("branchNameInput").placeholder = "輸入分行名稱開始搜尋";
      qs("branchNameInput").focus();
    });

    // 分行名稱：必須先選銀行（public）
    const onBranchInput = debounce(async ()=>{
      if (!selectedBankCode) {
        qs("branchNameInput").value = "";
        alert("請先選擇銀行");
        return;
      }

      const kw = qs("branchNameInput").value.trim();
      selectedBranchCode = "";

      if (kw.length < 1) {
        qs("branchList").innerHTML = "";
        return;
      }

      const res = await apiCall({ action:"searchBranchesPublic", bankCode: selectedBankCode, keyword: kw });
      const branches = (res && res.branches) ? res.branches : [];

      qs("branchList").innerHTML = branches.map(br =>
        `<option value="${escapeHtml(br.name)}" data-code="${escapeHtml(br.code)}"></option>`
      ).join("");
    }, 250);

    qs("branchNameInput").addEventListener("input", onBranchInput);

    // 分行 change：選定後回填 7碼
    qs("branchNameInput").addEventListener("change", ()=>{
      const val = qs("branchNameInput").value.trim();
      if (!val || !selectedBankCode) return;

      const foundCode = pickCodeFromDatalist("branchList", val);
      if (!foundCode) return;

      selectedBranchCode = foundCode;

      // ✅ 自動組 7 碼：bankCode(3) + branchCode(4)
      qs("bankBranch").value = `${selectedBankCode}${selectedBranchCode}`;
    });

    qs("btnSubmit").addEventListener("click", async ()=>{
      try{
        setMsg(msg, "送出中…請稍等資料上傳中…請勿關閉視窗", "ok");

        // ✅ 新增：簽名必填（空白不可送出）
        if (sig.isBlank()) throw new Error("必須簽名才能送出申請");

        // ✅ 送出當下補強：若 change 沒觸發，從 datalist 反查一次 code
        if (!selectedBankCode) {
          selectedBankCode = pickCodeFromDatalist("bankList", qs("bankNameInput").value.trim());
        }
        if (!selectedBranchCode) {
          selectedBranchCode = pickCodeFromDatalist("branchList", qs("branchNameInput").value.trim());
        }
        // 若兩者都有，確保 7碼一致
        if (selectedBankCode && selectedBranchCode) {
          qs("bankBranch").value = `${selectedBankCode}${selectedBranchCode}`;
        }

        const wmText = "僅限加入動元力國際";

        const payload = {
          "姓名": qs("name").value.trim(),
          "加入方案": qs("plan").value,
          "手機號碼": qs("phone").value.trim(),
          "身分證字號": qs("idno").value.trim().toUpperCase(),
          "出生日期": qs("dob").value,
          "銀行名稱": qs("bankNameInput").value.trim(),
          "分行名稱": qs("branchNameInput").value.trim(),
          "銀行分行": qs("bankBranch").value.trim(),
          "銀行帳戶": qs("bankAccount").value.trim(),
          "銀行戶名": qs("bankName").value.trim(),
          "通訊地址（縣市）": qs("addrCity").value.trim(),
          "通訊地址（區）": qs("addrDist").value.trim(),
          "通訊地址（詳細地址）": qs("addrDetail").value.trim(),
          "推薦人姓名": qs("refName").value.trim(),
          "推薦人手機號碼": qs("refPhone").value.trim(),

          consentChecked: qs("consent").checked,
          signatureDataUrl: sig.toDataUrl(),

          idFrontDataUrl: await fileToDataUrlWithWatermark(qs("idFront").files[0], wmText),
          idBackDataUrl: await fileToDataUrlWithWatermark(qs("idBack").files[0], wmText),
          bankbookDataUrl: await fileToDataUrl(qs("bankbook").files[0]),
        };


        // 前端最基本檢核（後端也會再檢核）
        if(!payload["姓名"] || !payload["手機號碼"] || !payload["身分證字號"] || !payload["出生日期"]) throw new Error("姓名/手機/身分證/出生日期為必填");
        if(!payload["通訊地址（縣市）"] || !payload["通訊地址（區）"] || !payload["通訊地址（詳細地址）"]) throw new Error("通訊地址需填完整");
        if(!payload.consentChecked) throw new Error("請先勾選同意聲明");

        const res = await apiCall({ action:"submitApplication", payload });

        // ✅ 修改：不要用 <br>（避免被當純文字顯示）
        setMsg(msg, `✅ ${res.message}（手機：${res.phone}）\n你可以使用「手機＋身分證末5碼」登入補件。`, "ok");
      }catch(err){
        // ✅ 顯示完整錯誤（包含 upstream_status / upstream_head）
        setMsg(msg, `❌ ${String(err?.message || err)}`, "err");
        console.error(err);
      }
    });
  </script>

</body>
</html>
