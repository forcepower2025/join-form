<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專屬邀約連結產生器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: "PingFang TC", sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        .card { background: white; width: 100%; max-width: 450px; padding: 30px; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); box-sizing: border-box; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #4a5568; }
        input { width: 100%; padding: 14px; border: 2px solid #edf2f7; border-radius: 14px; font-size: 16px; box-sizing: border-box; }
        .btn { width: 100%; padding: 16px; background-color: #4299e1; color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        #result-area { display: none; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #eee; }
        #link-display { background: #f8fafc; padding: 15px; border-radius: 12px; word-break: break-all; font-size: 14px; margin-bottom: 15px; color: #2d3748; }
        #capture-area { background: white; padding: 30px; border-radius: 10px; width: 250px; margin: 0 auto; }
        .download-btn { background-color: #48bb78; }
    </style>
</head>
<body>
    <div class="card">
            <h2>動元力國際股份有限公司</h2>
        <h2>專屬邀約連結生成器</h2>
        <div class="form-group">
            <label>介紹人姓名</label>
            <input type="text" id="refName" placeholder="請輸入姓名">
        </div>
        <div class="form-group">
            <label>介紹人手機</label>
            <input type="tel" id="refPhone" placeholder="請輸入 10 碼手機" oninput="autoCheck(this.value)">
        </div>
        <button id="genBtn" class="btn" style="display:none;" onclick="generateAll()">產生邀約連結與 QRC</button>

        <div id="result-area">
            <div id="link-display"></div>
            <button class="btn" onclick="copyLink()">一鍵複製連結</button>
            
            <div id="capture-area">
                <h2 style="margin:0 0 15px 0; color:#2d3748; font-size: 22px;">動元力國際</h2>
                <div id="qrcode" style="display:flex; justify-content:center; margin-bottom:15px;"></div>
                <div id="displayName" style="font-weight:bold; font-size: 18px;"></div>
                <div style="margin-top:5px; color:#718096;">誠摯的邀請您</div>
            </div>
            <button class="btn download-btn" onclick="downloadInviteImage()">下載邀約圖片</button>
        </div>
    </div>

    <script>
        const REGISTER_URL = "https://forcepower2026.com/register.html";

        function autoCheck(val) {
            const cleanVal = val.replace(/\D/g, '').slice(0, 10);
            document.getElementById('refPhone').value = cleanVal;
            const name = document.getElementById('refName').value;
            // 姓名不為空且手機滿 10 碼才顯示按鈕
            document.getElementById('genBtn').style.display = (cleanVal.length === 10 && name) ? 'block' : 'none';
        }

     async function generateAll() {
    const name = document.getElementById('refName').value.trim();
    const phone = document.getElementById('refPhone').value.trim();
    const longUrl = `${REGISTER_URL}?ref=${encodeURIComponent(name)}&refp=${phone}`;
    
    // 顯示處理中訊息
    document.getElementById('msg') ? document.getElementById('msg').innerText = "正在產生直連連結..." : null;

    try {
        // 使用 is.gd API，這家支援直接跳轉，不會停留在縮網址網頁
        // format=simple 會直接回傳字串格式的短網址
        const response = await fetch(`https://is.gd/create.php?format=simple&url=${encodeURIComponent(longUrl)}`);
        
        if (!response.ok) throw new Error('API 無法回應');
        
        const shortUrl = await response.text();
        
        // 1. 顯示短網址
        document.getElementById('link-display').innerHTML = `
            <div style="font-size: 14px; color: #718096; margin-bottom: 5px;">您的直連邀約連結：</div>
            <strong style="font-size: 16px; color: #2d3748;">${shortUrl}</strong>
        `;
        
        // 2. 更新 QRC 圖片內的姓名
        document.getElementById('displayName').innerText = name;
        
        // 3. 產生 QR Code
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: shortUrl,
            width: 180,
            height: 180,
            correctLevel: QRCode.CorrectLevel.H
        });
        
        document.getElementById('result-area').style.display = "block";
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

    } catch (e) {
        console.error("縮網址失敗:", e);
        // 備案：如果 API 失敗，直接用原始長網址產生 QRC
        document.getElementById('link-display').innerText = longUrl;
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), { text: longUrl, width: 180, height: 180 });
        document.getElementById('result-area').style.display = "block";
        alert("縮網址服務暫時忙碌，已使用原網址產生 QRC，功能不受影響。");
    }
}

        function copyLink() {
            const link = document.getElementById('link-display').innerText;
            navigator.clipboard.writeText(link).then(() => alert("連結已複製！"));
        }

        function downloadInviteImage() {
            const area = document.getElementById('capture-area');
            html2canvas(area, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `邀約卡_${document.getElementById('refName').value}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
