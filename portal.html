function initAddressSelects(){
  const citySel = qs("addrCity");
  const distSel = qs("addrDist");

        TW_CITY_DIST[city].map(d=>`<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join("");
    }
  });
}


	// ✅身份證加浮水印
async function fileToDataUrlWithWatermark(file, text, targetWidth){
  if (!file) return "";

  const srcDataUrl = await fileToDataUrl(file);

  const img = await new Promise((resolve, reject)=>{
    const im = new Image();
    im.onload = ()=> resolve(im);
    im.onerror = reject;
    im.src = srcDataUrl;
  });

  // ✅ 先算等比尺寸（只縮放寬度，height 等比）
  const ow = img.naturalWidth || img.width;
  const oh = img.naturalHeight || img.height;

  const tw = Math.max(1, Number(targetWidth) || ow);  // 沒給就用原寬
  const scale = tw / ow;
  const th = Math.max(1, Math.round(oh * scale));

  const canvas = document.createElement("canvas");
  canvas.width = tw;
  canvas.height = th;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, tw, th);

  const wm = String(text || "").trim();
  if (wm){
    const base = Math.min(canvas.width, canvas.height);
    const fontSize = Math.max(28, Math.floor(base * 0.06));

    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = "#000";
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = Math.max(2, Math.floor(fontSize * 0.08));
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `700 ${fontSize}px sans-serif`;

    const angle = -18 * Math.PI / 180;
    const W = canvas.width;
    const H = canvas.height;

    const padX = Math.max(60, Math.floor(W * 0.18));
    const padY = Math.max(60, Math.floor(H * 0.18));

    const positions = [
      { x: padX,     y: padY     },
      { x: W - padX, y: padY     },
      { x: padX,     y: H - padY },
      { x: W - padX, y: H - padY },
      { x: W / 2,    y: H / 2    },
    ];

    positions.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(angle);
      ctx.strokeText(wm, 0, 0);
      ctx.fillText(wm, 0, 0);
      ctx.restore();
    });

    ctx.restore();
  }

  // ✅ PNG 不吃 0.92 參數，直接輸出 PNG
  return canvas.toDataURL("image/png");
}

function debounce(fn, ms=250){
  let t=null;
  return (...args)=>{
    clearTimeout(t);
    t=setTimeout(()=>fn(...args), ms);
  };
}

  opts.forEach(op=>{

  qs("bankList").innerHTML = banks.map(b =>
    `<option value="${escapeHtml(b.name)}" data-code="${escapeHtml(b.code)}"></option>`
  ).join("");

  // ✅ 如果目前輸入值「剛好等於清單內某一個 bank name」，就當作已選定銀行並解鎖分行

  opts.forEach(op=>{
    if (op.value === kw && op.dataset && op.dataset.code) foundCode = op.dataset.code;

    function driveToImgSrc(x){
      const s = String(x || "").trim();
      if(!s) return "";

      // 1) 如果是純 Drive 檔案ID（你現在就是這種）
      if (/^[a-zA-Z0-9_-]{20,}$/.test(s) && !s.startsWith("http")) {
        return `https://drive.google.com/thumbnail?id=${s}&sz=w1600`;
      }

      // 2) 如果是 Drive 分享連結，抽出 id
      const m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/) || s.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (m && m[1]) {
        return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1600`;
      }

      // 3) 其他網址：原樣回傳
      return s;
    }

    function imgBlock(title, urlOrId){
      const imgSrc = driveToImgSrc(urlOrId);
      if(!imgSrc) return "";

      return `
        <div>
          <div class="muted" style="margin-bottom:6px;">${escapeHtml(title)}</div>
              ${/* <a class="btn-ghost" href="${escapeHtml(imgSrc)}" target="_blank" rel="noopener">開新視窗</a> */""}
          <div style="margin-top:8px;">
            <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(title)}"
                 style="max-width:100%; border-radius:12px; border:1px solid #eee;" />
          </div>
        </div>
      `;
    }

    // ✅ 新增：把模板合約拆成第1頁/第2頁，塞到既有容器，不動其他版面
// ✅ 修改：用「接續上頁｜」做切點，確保第1～7條一定進第1頁
async function renderContractFromTemplate_(plan, name){
  if (!plan) return;

  const res = await apiCall({ action:"getContractTemplate", plan });
  let tpl = String(res && res.html ? res.html : "");

  // 只代入姓名
  tpl = tpl.replaceAll("{{姓名}}", name || "");

  // ✅ 把模板轉成純文字HTML（取 body 內容）
  const doc = new DOMParser().parseFromString(tpl, "text/html");
  const bodyHtml = (doc.body ? doc.body.innerHTML : tpl);

  // ✅ 以「接續上頁｜」為切點分頁
  const cutKey = "<b>第八條｜";
  const idx = bodyHtml.indexOf(cutKey);

  let p1 = "";
  let p2 = "";

  if (idx >= 0) {
    p1 = bodyHtml.slice(0, idx);
    p2 = bodyHtml.slice(idx);
  } else {
    // 找不到切點就全部放第1頁，避免空白
    p1 = bodyHtml;
    p2 = "";
  }

  // ✅ 塞回兩頁容器
  const el1 = qs("contractPage1");
  const el2 = qs("contractPage2");
  if (el1) el1.innerHTML = p1;
  if (el2) el2.innerHTML = p2;
}
