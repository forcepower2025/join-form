function debounce(fn, ms=250){
  let t=null;
  return (...args)=>{
    clearTimeout(t);
    t=setTimeout(()=>fn(...args), ms);
  };
}

function pickCodeFromDatalist(listId, inputValue){
  const val = String(inputValue || "").trim();
  if (!val) return "";

  const opts = qs(listId).querySelectorAll("option");
  let found = "";
  opts.forEach(op=>{
    if (op.value === val && op.dataset && op.dataset.code) found = op.dataset.code;
  });
  return found;
}


  // 分行先鎖住
  qs("branchNameInput").value = "";
  qs("branchNameInput").disabled = true;
  qs("branchNameInput").placeholder = "請先選擇銀行";
  qs("branchList").innerHTML = "";

// 銀行名稱：輸入1字就查
const onBankInput = debounce(async ()=>{

  // 每次銀行輸入：分行狀態先重置（分行一定要跟著銀行走）

  selectedBranchName = "";

  qs("branchNameInput").disabled = true;
  qs("branchNameInput").placeholder = "請先選擇銀行";
  qs("branchList").innerHTML = "";
  qs("bankBranchCode").value = ""; // 清 7碼

  // ✅ 不要在這裡清 selectedBankCode，避免 datalist 點選造成 input 時把 code 洗掉

  if (kw.length < 1) {
    qs("bankList").innerHTML = "";
    selectedBankCode = "";
    selectedBankName = "";
    return;
  }

  const { phone, password } = loadSession();
  const res = await apiCall({ action:"searchBanks", phone, password, keyword: kw });
  const banks = (res && res.banks) ? res.banks : [];

  qs("bankList").innerHTML = banks.map(b =>
    `<option value="${escapeHtml(b.name)}" data-code="${escapeHtml(b.code)}"></option>`
  ).join("");

  // ✅ 如果目前輸入值「剛好等於清單內某一個 bank name」，就當作已選定銀行並解鎖分行
  const opts = qs("bankList").querySelectorAll("option");

  opts.forEach(op=>{
    if (op.value === kw && op.dataset && op.dataset.code) foundCode = op.dataset.code;
  });

  if (foundCode) {
    selectedBankCode = foundCode;
    selectedBankName = kw;

    qs("branchNameInput").disabled = false;
    qs("branchNameInput").placeholder = "輸入分行名稱開始搜尋";
  } else {
    selectedBankCode = "";
    selectedBankName = "";
  }

}, 250);


qs("bankNameInput").addEventListener("input", onBankInput);

qs("bankNameInput").addEventListener("change", ()=>{

  // 開放分行輸入
  qs("branchNameInput").disabled = false;

});

  qs("branchList").innerHTML = branches.map(b =>

qs("branchNameInput").addEventListener("change", ()=>{

  const opts = qs("branchList").querySelectorAll("option");

});

    function driveToImgSrc(x){
      const s = String(x || "").trim();
      if(!s) return "";

      // 1) 如果是純 Drive 檔案ID（你現在就是這種）
      if (/^[a-zA-Z0-9_-]{20,}$/.test(s) && !s.startsWith("http")) {
        return `https://drive.google.com/thumbnail?id=${s}&sz=w1600`;
      }

      // 2) 如果是 Drive 分享連結，抽出 id
      const m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/) || s.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (m && m[1]) {
        return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1600`;
      }

      // 3) 其他網址：原樣回傳
      return s;
    }

    function imgBlock(title, urlOrId){
      const imgSrc = driveToImgSrc(urlOrId);
      if(!imgSrc) return "";

      return `
        <div>
          <div class="muted" style="margin-bottom:6px;">${escapeHtml(title)}</div>
              ${/* <a class="btn-ghost" href="${escapeHtml(imgSrc)}" target="_blank" rel="noopener">開新視窗</a> */""}
          <div style="margin-top:8px;">
            <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(title)}"
                 style="max-width:100%; border-radius:12px; border:1px solid #eee;" />
          </div>
        </div>
      `;
    }

        setMsg(msg, `❌ ${err.message}`, "err");
      }
    });

    loadProfile().catch(err=>{
      qs("profile").innerHTML = `❌ 載入失敗：${escapeHtml(err.message)}`;
    });

function renderReferralBonus(rows){
  if (!rows || !rows.length) {
    qs("bonusWrap").innerHTML = `<div class="muted">目前尚無推薦加入紀錄。</div>`;
    return;
  }

  let html = `<table class="table">`;
  html += `<tr>
    <th>加入日期</th>
    <th>姓名</th>
    <th>獎金</th>
    <th>匯款日期</th>
  </tr>`;

  rows.forEach(r=>{
    html += `<tr>
      <td>${escapeHtml(String(r.joinDate || ""))}</td>
      <td>${escapeHtml(String(r.name || ""))}</td>
      <td>${escapeHtml(String(r.bonus || 10000))}</td>
      <td>${escapeHtml(String(r.remitDate || ""))}</td>
    </tr>`;
  });

  html += `</table>`;
  qs("bonusWrap").innerHTML = html;
}

async function loadReferralBonus(){
  const { phone, password } = loadSession();
  if(!phone || !password) return;

  const res = await apiCall({ action:"getReferralBonus", phone, password });
  const rows = (res && res.rows) ? res.rows : [];

  qs("bonusCard").style.display = "";
  renderReferralBonus(rows);
}


 </script>
