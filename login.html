84	    function loadCitySelector() {

110	    // ===== 錯誤次數 / 鎖定 10 分鐘（前端）=====
111	    const LOCK_MINUTES = 10;
112	    const MAX_FAILS = 5;
113	    const LS_FAIL_COUNT = "login_fail_count";
114	    const LS_LOCK_UNTIL = "login_lock_until"; // ms timestamp
115	
116	    function nowMs() { return Date.now(); }
117	
118	    function getLockState() {
119	      const until = Number(localStorage.getItem(LS_LOCK_UNTIL) || "0");
120	      if (until && nowMs() < until) {
121	        return { locked: true, until };
122	      }
123	      // 過期就自動歸零
124	      if (until && nowMs() >= until) {
125	        localStorage.removeItem(LS_LOCK_UNTIL);
126	        localStorage.removeItem(LS_FAIL_COUNT);
127	      }
128	      return { locked: false, until: 0 };
129	    }
130	
131	    function incFailAndMaybeLock() {
132	      const st = getLockState();
133	      if (st.locked) return st;
134	
135	      let c = Number(localStorage.getItem(LS_FAIL_COUNT) || "0");
136	      c += 1;
137	
138	      if (c >= MAX_FAILS) {
139	        const until = nowMs() + LOCK_MINUTES * 60 * 1000;
140	        localStorage.setItem(LS_LOCK_UNTIL, String(until));
141	        localStorage.removeItem(LS_FAIL_COUNT);
142	        return { locked: true, until };
143	      }
144	
145	      localStorage.setItem(LS_FAIL_COUNT, String(c));
146	      return { locked: false, until: 0, count: c };
147	    }
148	
149	    function resetFail() {
150	      localStorage.removeItem(LS_FAIL_COUNT);
151	      localStorage.removeItem(LS_LOCK_UNTIL);
152	    }
153	
154	    function remainText(until) {
155	      const sec = Math.max(0, Math.ceil((until - nowMs()) / 1000));
156	      const m = Math.floor(sec / 60);
157	      const s = sec % 60;
158	      return `${m}分${String(s).padStart(2,"0")}秒`;
159	    }

168	      if (lock.locked) {
169	        setMsg(msgEl, `❌ 登入已鎖定，剩餘 ${remainText(lock.until)}`, "err");
170	        return;
171	      }
172	
173	      const phone = qs("phone").value.trim();
174	      const password = qs("password").value.trim();
175	      const city = qs("loginCity").value.trim();
176	      const district = qs("loginDistrict").value.trim();
177	
178	      if (!phone || !password || !city || !district) {
179	        setMsg(msgEl, "❌ 請完整填寫：手機 / 密碼 / 縣市 / 區", "err");
180	        return;
181	      }
182	
183	      try {
184	        setMsg(msgEl, "登入中…", "ok");
185	
186	        // 注意：app.js 的 apiCall() 成功會回 json.result
187	        await apiCall({
188	          action: "login",
189	          phone,
190	          password,
191	          city,
192	          district
193	        });
194	
195	        // 成功：清除錯誤計數、保存 session
196	        resetFail();
197	        saveSession(phone, password, city, district);
198	
199	        setMsg(msgEl, "✅ 登入成功，跳轉中…", "ok");
200	        window.location.href = "./portal.html";
201	      } catch (err) {
202	        // 任一錯誤都算一次
203	        const st = incFailAndMaybeLock();
204	
205	        let errText = String(err?.message || err);
206	
207	        if (st.locked) {
208	          setMsg(msgEl, `❌ 錯誤達 ${MAX_FAILS} 次，已鎖定 ${LOCK_MINUTES} 分鐘。`, "err");
209	          return;
210	        }
211	
212	        // 顯示剩餘次數
213	        const left = MAX_FAILS - Number(localStorage.getItem(LS_FAIL_COUNT) || "0");
214	        setMsg(msgEl, `❌ 登入失敗（剩餘 ${left} 次）\n${errText}`, "err");
215	        console.error(err);
216	      }
217	    });
