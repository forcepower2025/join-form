<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>動元力會員系統</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div class="title">動元力會員系統</div>
        <div class="muted">請輸入手機號碼與預設密碼（身分證末5碼）。</div>
      </div>
      <div class="nav">
        <a href="./apply.html">回申請表</a>
      </div>
    </div>

    <div class="card">
      <div class="grid grid-2">
        <div>
          <label>手機號碼</label>
          <input id="phone" inputmode="numeric" placeholder="例：0912345678" />
        </div>
        <div>
          <label>密碼（身分證末5碼）</label>
          <input id="pwd" type="password" inputmode="numeric" placeholder="例：67890" />
        </div>
      </div>

      <div class="row" style="margin-top:12px;">
        <button id="btnLogin" class="btn-primary" type="button">登入</button>
      </div>

      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script>
function login(phone, password, city, district) {
  const sh = sh_(CONFIG.SHEET_MAIN);
  const headers = headers_(sh);

  const row = findRowByPhone_(sh, headers, String(phone));
  if (row === -1) throw new Error('帳號錯誤');

  const now = Date.now();

  const failCol = col_(headers,'登入錯誤次數') || 0;
  const lockCol = col_(headers,'鎖定到期時間') || 0;

  let failCount = Number(sh.getRange(row, failCol).getValue() || 0);
  let lockUntil = Number(sh.getRange(row, lockCol).getValue() || 0);

  if(lockUntil && now < lockUntil){
    throw new Error('帳號已鎖定，請10分鐘後再試');
  }

  const idno = String(sh.getRange(row, col_(headers,'身分證字號')).getValue() || '');
  const birth = String(sh.getRange(row, col_(headers,'出生日期')).getValue() || '');

  const last5 = idno.slice(-5);
  const d = new Date(birth);
  const roc = (d.getFullYear() - 1911).toString().padStart(3,'0') +
              (d.getMonth()+1).toString().padStart(2,'0') +
              d.getDate().toString().padStart(2,'0');

  const correctPwd = last5 + roc;

  const sheetCity = String(sh.getRange(row, col_(headers,'通訊地址（縣市）')).getValue() || '').trim();
  const sheetDistrict = String(sh.getRange(row, col_(headers,'通訊地址（區）')).getValue() || '').trim();

  const ok = password === correctPwd && city === sheetCity && district === sheetDistrict;

  if(!ok){
    failCount++;
    sh.getRange(row, failCol).setValue(failCount);
    if(failCount >= 5){
      sh.getRange(row, lockCol).setValue(now + 10*60*1000);
      sh.getRange(row, failCol).setValue(0);
      throw new Error('錯誤達5次，帳號鎖定10分鐘');
    }
    throw new Error('登入資料錯誤');
  }

  sh.getRange(row, failCol).setValue(0);
  sh.getRange(row, lockCol).setValue(0);

  return { message:'登入成功' };
}

    
  </script>
</body>
</html>
