<style>
    /* 基礎樣式設定 */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
        background-color: #f8f9f8;
        color: #333;
        line-height: 1.6;
    }

    a {
        text-decoration: none;
    }

    /* ===== 第一層 Header（purna 形式） ===== */

    #header-top .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translateX(2px);
}
    
    #header-top {
    position: sticky;
    top: 0;
    z-index: 3000;
    height: 72px;
    background: #e5e5e5;

    display: flex;
    align-items: center;
    justify-content: center; /* 用這個置中 */
}

#header-top .left-icon {
    position: absolute;
    left: 12px;
}


    #header-top .logo img {
        max-height: 42px;
        width: auto;
        display: block;
    }

    #header-top .hamburger,
    #header-top .member {
        color: #5b5959;
        font-size: 24px;
        cursor: pointer;
        line-height: 1;
        user-select: none;
    }

    /* ===== 第二層 主選單 ===== */
    #menu-titles {
        letter-spacing: 1px;
        position: sticky;
        top: 72px;
        z-index: 2900;
        background: #a59e8a;
        backdrop-filter: blur(6px);
        border-top: 1px solid rgba(255,255,255,0.12);
        border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .menu-inner {
        max-width: 1280px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding: 0 20px;
    }

    .menu-item {
        position: relative;
    }

    .menu-title {
        display: block;
        color: #fff;
        font-size: 18px;
        padding: 10px 14px;
        white-space: nowrap;
        transition: background 0.25s ease, color 0.25s ease;
    }

    .menu-title:hover {
        background: rgba(255,255,255,0.08);
    }

    .submenu-list {
        list-style: none;
        position: absolute;
        top: 100%;
        left: 0;
        min-width: 190px;
        background:  #a59e8a;
        box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        opacity: 0;
        visibility: hidden;
        transform: translateY(10px);
        transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s ease;
        z-index: 2950;
    }

    .submenu-list li a {
        display: block;
        color: #fff;
        padding: 11px 16px;
        font-size: 18px;
        white-space: nowrap;
        transition: background 0.25s ease;
    }

    .submenu-list li a:hover {
        background: rgba(255,255,255,0.1);
    }

    .menu-item:hover .submenu-list {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    /* 外層容器 */
    .wrapper {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    /* 圖片容器 */
    .image-card {
        position: relative;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        margin-bottom: 30px;
    }

    /* 長圖錨點定位 */
    .anchor-point {
        position: absolute;
        left: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
        scroll-margin-top: 150px;
    }

    /* RWD 圖片關鍵設定 */
    .responsive-img {
        display: block;
        width: 100%;
        height: auto;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: high-quality;
    }

    /* 文案樣式 */
    .content-section {
        padding: 30px;
        text-align: center;
    }

    h1 {
        color: #2e7d32;
        font-size: 1.8rem;
        margin-bottom: 10px;
    }

    p {
        color: #666;
        font-size: 1rem;
    }

    /* 頁尾樣式優化 */
    footer {
        background-color: #f4f4f4;
        padding: 40px 20px;
        text-align: center;
        margin-top: 50px;
    }

    .footer-logo {
        height: 40px;
        width: auto;
        margin-bottom: 15px;
        object-fit: contain;
    }

    /* ===== 手機選單 ===== */
    @media (max-width: 992px) {
        #header-top {
            height: 64px;
        }

        #menu-titles {
            top: 64px;
        }

        .menu-inner {
            display: none;
            flex-direction: column;
            align-items: stretch;
            gap: 0;
            padding: 0;
        }

        #menu-titles.active .menu-inner {
            display: flex;
        }

        .menu-item {
            width: 100%;
            border-top: 1px solid rgba(255,255,255,0.12);
        }

        .menu-title {
            padding: 14px 18px;
        }

        .submenu-list {
            position: static;
            min-width: auto;
            box-shadow: none;
            opacity: 1;
            visibility: visible;
            transform: none;
            display: none;
        }

        .menu-item.open .submenu-list {
            display: block;
        }

        .submenu-list li a {
            padding: 11px 30px;
        }
    }

    /* 手機版微調 */
    @media (max-width: 768px) {
        .wrapper {
            padding: 10px;
        }
        .content-section {
            padding: 20px 15px;
        }
        h1 {
            font-size: 1.4rem;
        }
    }
</style>
</head>
