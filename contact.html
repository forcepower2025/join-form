<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
        background-color: #f8f9f8;
        color: #333;
        line-height: 1.6;
    }

    a {
        text-decoration: none;
    }

    /* ===== 第一層 Header ===== */
    #header-top .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateX(2px);
    }
    
    #header-top {
        position: sticky;
        top: 0;
        z-index: 3000;
        height: 72px;
        background: #e5e5e5;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #header-top .left-icon {
        position: absolute;
        left: 12px;
    }

    #header-top .logo img {
        max-height: 42px;
        width: auto;
        display: block;
    }

    #header-top .hamburger {
        color: #5b5959;
        font-size: 24px;
        cursor: pointer;
        line-height: 1;
        user-select: none;
    }

    /* ===== 第二層 主選單 ===== */
    #menu-titles {
        letter-spacing: 1px;
        position: sticky;
        top: 72px;
        z-index: 2900;
        background: #a59e8a;
        backdrop-filter: blur(6px);
        border-top: 1px solid rgba(255,255,255,0.12);
        border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .menu-inner {
        max-width: 1280px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding: 0 20px;
    }

    .menu-item {
        position: relative;
    }

    .menu-title {
        display: block;
        color: #fff;
        font-size: 18px;
        padding: 10px 14px;
        white-space: nowrap;
        transition: background 0.25s ease, color 0.25s ease;
    }

    .menu-title:hover {
        background: rgba(255,255,255,0.08);
    }

    .submenu-list {
        list-style: none;
        position: absolute;
        top: 100%;
        left: 0;
        min-width: 190px;
        background: #a59e8a;
        box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        opacity: 0;
        visibility: hidden;
        transform: translateY(10px);
        transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s ease;
        z-index: 2950;
    }

    .submenu-list li a {
        display: block;
        color: #fff;
        padding: 11px 16px;
        font-size: 18px;
        white-space: nowrap;
        transition: background 0.25s ease;
    }

    .submenu-list li a:hover {
        background: rgba(255,255,255,0.1);
    }

    .menu-item:hover .submenu-list {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    /* ===== 聯絡頁主區塊 ===== */
    .contact-wrapper {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px 20px;
    }

    .page-title {
        text-align: center;
        font-size: 32px;
        color: #333;
        margin-bottom: 30px;
        letter-spacing: 2px;
    }

    .cards {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
    }

    .card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        overflow: hidden;
    }

    .card-header {
        background: #a59e8a;
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        padding: 14px 20px;
        letter-spacing: 1px;
    }

    .card-body {
        padding: 24px;
    }

    .contact-item {
        margin-bottom: 16px;
        font-size: 17px;
        color: #555;
    }

    .contact-item:last-child {
        margin-bottom: 0;
    }

    .contact-item strong {
        display: inline-block;
        min-width: 92px;
        color: #333;
    }

    .map-box {
        border-radius: 12px;
        overflow: hidden;
    }

    .map-box iframe {
        width: 100%;
        height: 420px;
        border: 0;
        display: block;
    }

    .social {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    .social a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 120px;
        height: 48px;
        padding: 0 20px;
        border-radius: 999px;
        background: #f2f2f2;
        color: #333;
        font-size: 16px;
        transition: all 0.25s ease;
    }

    .social a:hover {
        background: #a59e8a;
        color: #fff;
    }

    footer {
        background-color: #f4f4f4;
        padding: 40px 20px;
        text-align: center;
        margin-top: 50px;
    }

    /* ===== 手機選單 ===== */
    @media (max-width: 992px) {
        #header-top {
            height: 64px;
        }

        #menu-titles {
            top: 64px;
        }

        .menu-inner {
            display: none;
            flex-direction: column;
            align-items: stretch;
            gap: 0;
            padding: 0;
        }

        #menu-titles.active .menu-inner {
            display: flex;
        }

        .menu-item {
            width: 100%;
            border-top: 1px solid rgba(255,255,255,0.12);
        }

        .menu-title {
            padding: 14px 18px;
        }

        .submenu-list {
            position: static;
            min-width: auto;
            box-shadow: none;
            opacity: 1;
            visibility: visible;
            transform: none;
            display: none;
        }

        .menu-item.open .submenu-list {
            display: block;
        }

        .submenu-list li a {
            padding: 11px 30px;
        }
    }

    @media (max-width: 768px) {
        .contact-wrapper {
            padding: 24px 12px 12px;
        }

        .page-title {
            font-size: 26px;
            margin-bottom: 20px;
        }

        .card-header {
            font-size: 18px;
            padding: 12px 16px;
        }

        .card-body {
            padding: 18px 16px;
        }

        .contact-item {
            font-size: 16px;
        }

        .contact-item strong {
            min-width: 78px;
        }

        .map-box iframe {
            height: 320px;
        }

        .social {
            gap: 12px;
        }

        .social a {
            min-width: calc(50% - 6px);
            font-size: 15px;
        }
    }
</style>
</head>
