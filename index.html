<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動元力國際｜早餐聯盟健康共享平台</title>

<style>
    /* 基礎設定 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
        font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
        background-color: #f8f9f8;
        color: #333;
        line-height: 1.6;
        overflow-x: hidden;
    }
    a { text-decoration: none; }

    /* ===== 開場動畫樣式 ===== */
    #splash {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: #fff;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #splash img { width: 100%; height: 100%; object-fit: cover; }
    #splash.fade-out { opacity: 0; visibility: hidden; }

    /* ===== 第一層 Header ===== */
    #header-top {
        position: sticky;
        top: 0;
        z-index: 3000;
        height: 72px;
        background: #e5e5e5;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #header-top .left-icon { position: absolute; left: 12px; }
    #header-top .logo img { max-height: 42px; width: auto; display: block; }
    #header-top .hamburger { color: #5b5959; font-size: 24px; cursor: pointer; }

    /* ===== 第二層 主選單 ===== */
    #menu-titles {
        position: sticky;
        top: 72px;
        z-index: 2900;
        background: #a59e8a;
        backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .menu-inner {
        max-width: 1280px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        gap: 20px;
    }
    .menu-item { position: relative; }
    .menu-title {
        display: block;
        color: #fff;
        padding: 12px 15px;
        font-size: 17px;
    }
    .submenu-list {
        list-style: none;
        position: absolute;
        top: 100%; left: 0;
        background: #a59e8a;
        min-width: 160px;
        opacity: 0; visibility: hidden;
        transition: 0.3s;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .menu-item:hover .submenu-list { opacity: 1; visibility: visible; }
    .submenu-list li a { display: block; color: #fff; padding: 10px 15px; border-top: 1px solid rgba(255,255,255,0.1); }

    /* ===== 輪播圖樣式 ===== */
    .hero {
        position: relative;
        width: 100%;
        height: 60vh; /* 調整高度 */
        background: #000;
        overflow: hidden;
    }
    .slide {
        position: absolute;
        width: 100%; height: 100%;
        opacity: 0;
        transition: opacity 1s ease-in-out;
    }
    .slide.active { opacity: 1; }
    .slide img { width: 100%; height: 100%; object-fit: cover; }

    .arrow {
        position: absolute;
        top: 50%; transform: translateY(-50%);
        background: rgba(0,0,0,0.3);
        color: #fff; font-size: 40px;
        padding: 10px 20px; cursor: pointer; z-index: 10;
        user-select: none;
    }
    .arrow.left { left: 20px; }
    .arrow.right { right: 20px; }

    /* 手機版 RWD */
    @media (max-width: 992px) {
        .menu-inner { display: none; flex-direction: column; }
        #menu-titles.active .menu-inner { display: flex; }
        .submenu-list { position: static; display: none; opacity: 1; visibility: visible; }
        .menu-item.open .submenu-list { display: block; }
        .hero { height: 40vh; }
    }
</style>
</head>
<body>

<div id="splash">
    <picture>
        <source media="(max-width:768px)" srcset="https://lh3.googleusercontent.com/d/1DOC0H23-wYiFrpwLo2bAQYMj-LW79fTr">
        <img src="https://lh3.googleusercontent.com/d/13vmEyVCkGkC3FIMphgCCqUPeq3LX-r2x" alt="Welcome">
    </picture>
</div>

<header id="header-top">
    <div class="left-icon">
        <div class="hamburger" id="hamburger">☰</div>
    </div>
    <a class="logo" href="index.html">
        <img src="https://lh3.googleusercontent.com/d/1pLB5WF3lUy3zz7gLvaTBKaARo6BULVZ-" alt="動元力國際">
    </a>
</header>

<div id="menu-titles">
    <div class="menu-inner">
        <div class="menu-item">
            <a class="menu-title" href="about.html">關於公司</a>
            <ul class="submenu-list">
                <li><a href="about.html#philosophy">▶企業理念</a></li>
                <li><a href="about.html#origin">▶創業緣起</a></li>
                <li><a href="about.html#trademark">▶註冊商標</a></li>
            </ul>
        </div>
        <div class="menu-item">
            <a class="menu-title" href="product.html">產品介紹</a>
            <ul class="submenu-list">
                <li><a href="product.html#features">▶產品特色</a></li>
                <li><a href="product.html#details">▶詳細說明</a></li>
            </ul>
        </div>
        <div class="menu-item"><a class="menu-title" href="news.html">最新公告</a></div>
        <div class="menu-item"><a class="menu-title" href="contact.html">聯絡我們</a></div>
        <div class="menu-item"><a class="menu-title" href="login.html">登入會員</a></div>
    </div>
</div>

<div class="hero">
    <div class="slide active"><img src="https://lh3.googleusercontent.com/d/19AGk_oMvKPdF45nN0N_NlRQOCARsNeHs"></div>
    <div class="slide"><img src="https://lh3.googleusercontent.com/d/17-QAD7TE_7rX8FPSbcnzMSYzXWiZg4dZ"></div>
    <div class="slide"><img src="https://lh3.googleusercontent.com/d/1rtHyeCgFksEemspdWXtfwALyfXVc8WHC"></div>
    <div class="slide"><img src="https://lh3.googleusercontent.com/d/1xr89uvt3fWonS9bB-GIKl5Xcvf9JYj5a"></div>
    <div class="slide"><img src="https://lh3.googleusercontent.com/d/1b_UaS9fiQIvctOFwSUvJmJw23ARv431B"></div>
    
    <div class="arrow left" onclick="prevSlide()">‹</div>
    <div class="arrow right" onclick="nextSlide()">›</div>
</div>

<footer style="text-align:center; padding:40px;">
    © 2026 動元力國際 版權所有
</footer>

<script>
    /* 開場淡出：2秒後執行 */
    setTimeout(() => {
        document.getElementById("splash").classList.add("fade-out");
    }, 2000);

    /* 輪播功能 */
    let currentIndex = 0;
    const slides = document.querySelectorAll(".slide");

    function showSlide(i) {
        slides.forEach(s => s.classList.remove("active"));
        slides[i].classList.add("active");
    }

    function nextSlide() {
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide(currentIndex);
    }

    function prevSlide() {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        showSlide(currentIndex);
    }

    /* 自動播放輪播圖 */
    setInterval(nextSlide, 4000);

    /* 手機漢堡選單 */
    const hamburger = document.getElementById("hamburger");
    const menuTitles = document.getElementById("menu-titles");
    hamburger.addEventListener("click", () => {
        menuTitles.classList.toggle("active");
    });

    /* 手機版子選單點擊 */
    document.querySelectorAll(".menu-item > .menu-title").forEach(title => {
        title.addEventListener("click", function(e) {
            if (window.innerWidth <= 992) {
                const parent = this.parentElement;
                if (parent.querySelector(".submenu-list")) {
                    e.preventDefault();
                    parent.classList.toggle("open");
                }
            }
        });
    });
</script>

</body>
</html>
