<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>動元力國際加盟商申請表</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div class="title">動元力國際微股東申請表</div>
        <div class="muted">請確實填寫個人資料</div>
      </div>
      <div class="nav">
        <a href="./login.html">登入</a>
      </div>
    </div>

    <div class="card">
      <div class="grid grid-2">
        <div>
          <label>姓名</label>
          <input id="name" placeholder="請輸入姓名" />
        </div>
        <div>
          <label>手機號碼</label>
          <input id="phone" inputmode="numeric" placeholder="例：0912345678" />
        </div>

        <div>
          <label>身分證字號</label>
          <input id="idno" placeholder="例：A123456789" />
          <div class="muted">登入預設密碼為「身分證字號末5碼」</div>
        </div>
        <div>
          <label>出生日期</label>
          <input id="dob" type="date" />
        </div>

        <!-- ✅ 銀行名稱（datalist，與 portal 同款） -->
        <div>
          <label>銀行名稱</label>
          <input id="bankNameInput"
                 placeholder="輸入銀行名稱搜尋"
                 list="bankList" />
          <datalist id="bankList"></datalist>
        </div>

        <!-- ✅ 分行名稱（需先選銀行） -->
        <div>
          <label>分行名稱</label>
          <input id="branchNameInput"
                 placeholder="請先選擇銀行"
                 list="branchList"
                 disabled />
          <datalist id="branchList"></datalist>
        </div>

        <div>
          <label>銀行代碼與分行代碼(共7碼)</label>
          <input id="bankBranch" placeholder="系統自動帶入" readonly />
        </div>

        <div>
          <label>銀行帳戶</label>
          <input id="bankAccount" placeholder="請輸入帳號" />
        </div>

        <div>
          <label>銀行戶名</label>
          <input id="bankName" placeholder="請輸入戶名" />
        </div>

        <div>
          <label>推薦人姓名</label>
          <input id="refName" placeholder="（可選填）" />
        </div>

        <div>
          <label>推薦人手機號碼</label>
          <input id="refPhone" inputmode="numeric" placeholder="（可選填）" />
        </div>

        <div></div>

        <div>
          <label>通訊地址（縣市）</label>
          <input id="addrCity" placeholder="例：台北市" />
        </div>
        <div>
          <label>通訊地址（區）</label>
          <input id="addrDist" placeholder="例：中正區" />
        </div>
        <div style="grid-column: 1 / -1;">
          <label>通訊地址（詳細地址）</label>
          <input id="addrDetail" placeholder="例：中山北路一段2號" />
        </div>
      </div>
    </div>

    <!-- 其餘內容完全未動 -->
    <!-- （上傳區、合約內容、同意聲明、簽名、送出按鈕全部保留） -->

    <div class="card">
      <div class="row" style="margin-top:12px;">
        <button id="btnSubmit" class="btn-primary" type="button">送出申請</button>
      </div>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script src="./app.js"></script>

<script>
/* ===== 銀行 / 分行（datalist，與 portal 完全同邏輯）===== */

let selectedBankCode = "";
let selectedBranchCode = "";

// 銀行搜尋
qs("bankNameInput").addEventListener("input", async () => {
  const kw = qs("bankNameInput").value.trim();

  selectedBankCode = "";
  selectedBranchCode = "";
  qs("bankBranch").value = "";
  qs("branchNameInput").value = "";
  qs("branchNameInput").disabled = true;
  qs("branchList").innerHTML = "";

  if (!kw) {
    qs("bankList").innerHTML = "";
    return;
  }

  const res = await apiCall({
    action: "searchBanksPublic",
    keyword: kw,
  });

  qs("bankList").innerHTML = (res.banks || []).map(b =>
    `<option value="${b.name}" data-code="${b.code}"></option>`
  ).join("");
});

// 銀行選定
qs("bankNameInput").addEventListener("change", () => {
  const val = qs("bankNameInput").value.trim();
  const opts = qs("bankList").querySelectorAll("option");

  let foundCode = "";
  opts.forEach(op => {
    if (op.value === val) foundCode = op.dataset.code;
  });

  if (!foundCode) {
    selectedBankCode = "";
    qs("branchNameInput").disabled = true;
    return;
  }

  selectedBankCode = foundCode;
  qs("branchNameInput").disabled = false;
  qs("branchNameInput").placeholder = "輸入分行名稱搜尋";
});

// 分行搜尋
qs("branchNameInput").addEventListener("input", async () => {
  if (!selectedBankCode) return;

  const kw = qs("branchNameInput").value.trim();

  const res = await apiCall({
    action: "searchBranchesPublic",
    bankCode: selectedBankCode,
    keyword: kw,
  });

  qs("branchList").innerHTML = (res.branches || []).map(br =>
    `<option value="${br.name}" data-code="${br.code}"></option>`
  ).join("");
});

// 分行選定 → 自動組 7 碼
qs("branchNameInput").addEventListener("change", () => {
  const val = qs("branchNameInput").value.trim();
  const opts = qs("branchList").querySelectorAll("option");

  let foundCode = "";
  opts.forEach(op => {
    if (op.value === val) foundCode = op.dataset.code;
  });

  if (!foundCode) return;

  selectedBranchCode = foundCode;
  qs("bankBranch").value = selectedBankCode + selectedBranchCode;
});
</script>

</body>
</html>
