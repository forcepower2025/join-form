<style>
    /* 基礎設定 */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== 開場動畫：主圖完整顯示 + 背景模糊羽化 ===== */
    #splash {

        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #fff;
        z-index: 9999;
        overflow: hidden;
        transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    /* 背景模糊羽化層 */
    #splash::before {
        content: "";
        position: absolute;
        top: -10vh;
        left: -10vw;
        width: 120vw;
        height: 120vh;
        background-image: var(--splash-bg);
        background-size: cover;
        background-position: center;
        filter: blur(60px) brightness(0.7) saturate(1.2);
        -webkit-mask-image: radial-gradient(ellipse at center, black 52%, transparent 86%);
        mask-image: radial-gradient(ellipse at center, black 52%, transparent 86%);
        z-index: 1;
    }

    /* 前景主圖：完整顯示、不裁切 */
    #splash picture,
    #splash img {
        position: relative;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 2;
    }

    #splash img {
        object-fit: fill;
    }

    #splash.fade-out { 
        opacity: 0; 
        visibility: hidden; 
    }

    /* ===== Header (固定) ===== */

        position: sticky; top: 0; z-index: 3000;
        height: 72px; background: #e5e5e5;

    /* ===== 主選單 (固定) ===== */

    }

    .menu-title:hover { background: rgba(255,255,255,0.1); }

    .submenu-list {
        list-style: none; position: absolute; top: 100%; left: 0;
        background: #a59e8a; min-width: 180px;
        opacity: 0; visibility: hidden; transform: translateY(10px);

    .submenu-list li a {

    /* ===== 輪播圖容器 (限高 80vh) ===== */

        width: 100vw;
        height: 80vh;
        overflow: hidden;

    }
    
    /* ===== 幻燈片容器 ===== */
    .slide {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: none; opacity: 0;
        transition: opacity 1.2s ease-in-out;
    }

    .slide img.slide-bg {

        top: -12%;
        left: -12%;

    }

    /* ===== 前景主圖：輪播圖片完整顯示 ===== */
    .slide img.slide-fg {
        position: relative;
        width: 100%; height: 100%;
        object-fit: fill;

        z-index: 2;
    }

    .arrow {

        background: rgba(0,0,0,0.2); color: #fff; font-size: 35px;

<script>
    const splash = document.getElementById("splash");
    const splashImg = splash ? splash.querySelector("img") : null;

    if (splash && splashImg) {
        splash.style.setProperty("--splash-bg", `url('${splashImg.currentSrc || splashImg.src}')`);
    }

    setTimeout(() => {
        if(splash) splash.classList.add("fade-out");
    }, 2000);

    let currentIndex = 0;
    const slides = document.querySelectorAll(".slide");

    function showSlide(n) {
        slides.forEach(s => {
            s.style.display = 'none';
            s.classList.remove("active");
        });
        slides[n].style.display = 'block';
        setTimeout(() => {
            slides[n].classList.add("active");
        }, 10);
    }

    function nextSlide() {
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide(currentIndex);
    }

    function prevSlide() {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        showSlide(currentIndex);
    }

    showSlide(currentIndex);
    setInterval(nextSlide, 4000);

    const hamburger = document.getElementById("hamburger");
    const menuTitles = document.getElementById("menu-titles");
    hamburger.addEventListener("click", () => {
        menuTitles.classList.toggle("active");
    });

    /* ===== 新增：觸控滑動功能 ===== */
let touchStartX = 0;
let touchEndX = 0;

const heroContainer = document.querySelector('.hero');

heroContainer.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

heroContainer.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
}, { passive: true });

function handleSwipe() {
    const swipeThreshold = 50; // 滑動超過 50 像素才觸發
    if (touchEndX < touchStartX - swipeThreshold) {
        // 向左滑 -> 下一張
        nextSlide();
    }
    if (touchEndX > touchStartX + swipeThreshold) {
        // 向右滑 -> 上一張
        prevSlide();
    }
}
    
</script>
