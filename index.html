<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動元力國際｜早餐聯盟健康共享平台</title>

<link rel="icon" href="https://lh3.googleusercontent.com/d/1xvNsSNKezzuXixviQLTJokSUtcIxxDZF=s32" type="image/x-icon">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1xvNsSNKezzuXixviQLTJokSUtcIxxDZF=s180">
<link rel="apple-touch-icon" sizes="152x152" href="https://lh3.googleusercontent.com/d/1xvNsSNKezzuXixviQLTJokSUtcIxxDZF=s152">
<link rel="apple-touch-icon" sizes="180x180" href="https://lh3.googleusercontent.com/d/1xvNsSNKezzuXixviQLTJokSUtcIxxDZF=s180">
<link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1xvNsSNKezzuXixviQLTJokSUtcIxxDZF=s192">

<meta property="og:title" content="動元力國際｜早餐聯盟健康共享平台">
<meta property="og:description" content="提供經銷商加盟方案，健康蔬果餐包：打造共享經濟與健康生活的新模式。">
<meta property="og:image" content="https://lh3.googleusercontent.com/d/1xvNsSNKezzuXixviQLTJokSUtcIxxDZF=s600">
<meta property="og:type" content="website">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
        background-color: #f8f9f8;
        color: #333;
        line-height: 1.6;
    }

    a {
        text-decoration: none;
    }

    /* ===== 第一層 Header ===== */
    #header-top .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateX(2px);
    }
    
    #header-top {
        position: sticky;
        top: 0;
        z-index: 3000;
        height: 72px;
        background: #e5e5e5;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #header-top .left-icon {
        position: absolute;
        left: 12px;
    }

    #header-top .logo img {
        max-height: 42px;
        width: auto;
        display: block;
    }

    #header-top .hamburger {
        color: #5b5959;
        font-size: 24px;
        cursor: pointer;
        line-height: 1;
        user-select: none;
    }

    /* ===== 第二層 主選單 ===== */
    #menu-titles {
        letter-spacing: 1px;
        position: sticky;
        top: 72px;
        z-index: 2900;
        background: #a59e8a;
        backdrop-filter: blur(6px);
        border-top: 1px solid rgba(255,255,255,0.12);
        border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .menu-inner {
        max-width: 1280px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding: 0 20px;
    }

    .menu-item {
        position: relative;
    }

    .menu-title {
        display: block;
        color: #fff;
        font-size: 18px;
        padding: 10px 14px;
        white-space: nowrap;
        transition: background 0.25s ease, color 0.25s ease;
    }

    .menu-title:hover {
        background: rgba(255,255,255,0.08);
    }

    .submenu-list {
        list-style: none;
        position: absolute;
        top: 100%;
        left: 0;
        min-width: 190px;
        background: #a59e8a;
        box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        opacity: 0;
        visibility: hidden;
        transform: translateY(10px);
        transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s ease;
        z-index: 2950;
    }

    .submenu-list li a {
        display: block;
        color: #fff;
        padding: 11px 16px;
        font-size: 18px;
        white-space: nowrap;
        transition: background 0.25s ease;
    }

    .submenu-list li a:hover {
        background: rgba(255,255,255,0.1);
    }

    .menu-item:hover .submenu-list {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

<!-- ===== 開場 ===== -->
<div id="splash">
    <picture>
        <source media="(max-width:768px)" 
        srcset="https://lh3.googleusercontent.com/d/1DOC0H23-wYiFrpwLo2bAQYMj-LW79fTr">
        <img src="https://lh3.googleusercontent.com/d/13vmEyVCkGkC3FIMphgCCqUPeq3LX-r2x">
    </picture>
</div>

<!-- Header -->
<header id="header-top">
    <div class="left-icon">
        <div id="hamburger">☰</div>
    </div>
    <a class="logo" href="#">
        <img src="https://lh3.googleusercontent.com/d/1pLB5WF3lUy3zz7gLvaTBKaARo6BULVZ-">
    </a>
</header>

<!-- ===== 輪播 ===== -->
<div class="hero">

    <div class="slide active">
        <img src="https://lh3.googleusercontent.com/d/19AGk_oMvKPdF45nN0N_NlRQOCARsNeHs">
    </div>

    <div class="slide">
        <img src="https://lh3.googleusercontent.com/d/17-QAD7TE_7rX8FPSbcnzMSYzXWiZg4dZ">
    </div>

    <div class="slide">
        <img src="https://lh3.googleusercontent.com/d/1rtHyeCgFksEemspdWXtfwALyfXVc8WHC">
    </div>

    <div class="slide">
        <img src="https://lh3.googleusercontent.com/d/1xr89uvt3fWonS9bB-GIKl5Xcvf9JYj5a">
    </div>

    <div class="slide">
        <img src="https://lh3.googleusercontent.com/d/1b_UaS9fiQIvctOFwSUvJmJw23ARv431B">
    </div>

    <div class="arrow left" onclick="prevSlide()">‹</div>
    <div class="arrow right" onclick="nextSlide()">›</div>

</div>

/* ===== 主區塊 ===== */


<script>

/* ===== 開場淡出 ===== */
setTimeout(()=>{
    document.getElementById("splash").classList.add("fade-out");
},2000);

/* ===== 輪播 ===== */
let index=0;
const slides=document.querySelectorAll(".slide");

function showSlide(i){
    slides.forEach(s=>s.classList.remove("active"));
    slides[i].classList.add("active");
}

function nextSlide(){
    index=(index+1)%slides.length;
    showSlide(index);
}

function prevSlide(){
    index=(index-1+slides.length)%slides.length;
    showSlide(index);
}

/* 自動播放 */
setInterval(nextSlide,4000);

</script>


</body>
</html>
