<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
        font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
        background-color: #f8f9f8;
        color: #333;
        line-height: 1.6;
        overflow-x: hidden;
    }
    a { text-decoration: none; }

    /* ===== 開場動畫 ===== */
#splash {
        position: fixed;
        top: 0; 
        left: 0; 
        width: 100vw; /* 視窗寬度 100% */
        height: 100vh; /* 視窗高度 100% */
        background: #fff;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #splash picture, #splash img {
        width: 100%;
        height: 100%;
        /* 修正：使用 cover 確保圖片「填滿」全螢幕，左右不留白 */
        object-fit: cover; 
    }
    #splash.fade-out { opacity: 0; visibility: hidden; }
    /* ===== 第一層 Header (固定) ===== */
    #header-top {
        position: sticky;
        top: 0;
        z-index: 3000;
        height: 72px;
        background: #e5e5e5;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #header-top .left-icon { position: absolute; left: 12px; }
    #header-top .logo img { max-height: 42px; width: auto; display: block; }
    #header-top .hamburger { color: #5b5959; font-size: 28px; cursor: pointer; user-select: none; }

    /* ===== 第二層 主選單 (固定) ===== */
    #menu-titles {
        position: sticky;
        top: 72px;
        z-index: 2900;
        background: #a59e8a;
        backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .menu-inner {
        max-width: 1280px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        gap: 15px;
    }
    .menu-item { position: relative; }
    .menu-title {
        display: block;
        color: #fff;
        padding: 12px 14px;
        font-size: 17px;
        white-space: nowrap;
        transition: background 0.3s;
    }
    .menu-title:hover { background: rgba(255,255,255,0.1); }

    /* 子選單 */
    .submenu-list {
        list-style: none;
        position: absolute;
        top: 100%; left: 0;
        background: #a59e8a;
        min-width: 180px;
        opacity: 0; visibility: hidden;
        transform: translateY(10px);
        transition: 0.3s ease;
    }
    .menu-item:hover .submenu-list { opacity: 1; visibility: visible; transform: translateY(0); }
    .submenu-list li a {
        display: block;
        color: #fff;
        padding: 11px 16px;
        font-size: 16px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }

    /* ===== 輪播圖 (左右滿版) ===== */
    .hero {
        position: relative;
        width: 100vw;
        height: auto;
        overflow: hidden;
        background: #000;
    }
    .slide {
        position: absolute;
        width: 100%; height: 100%;
        opacity: 0;
        transition: opacity 1.2s ease-in-out;
    }
    .slide.active { opacity: 1; }
    .slide img { width: 100%; height: auto; object-fit: cover; }

    .arrow {
        position: absolute;
        top: 50%; transform: translateY(-50%);
        background: rgba(0,0,0,0.2);
        color: #fff; font-size: 45px;
        width: 60px; height: 60px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; z-index: 10;
        border-radius: 50%;
    }
    .arrow.left { left: 20px; }
    .arrow.right { right: 20px; }

    /* 手機版 RWD */
    @media (max-width: 992px) {
        .menu-inner { display: none; flex-direction: column; width: 100%; }
        #menu-titles.active .menu-inner { display: flex; }
        .submenu-list { position: static; display: none; opacity: 1; visibility: visible; }
        .menu-item.open .submenu-list { display: block; }
        .hero { height: 45vh; }
    }
</style>
</head>
<body>

<div id="menu-titles">

            <ul class="submenu-list">

            </ul>
        </div>
        <div class="menu-item">

            <ul class="submenu-list">
                <li><a href="product.html#features">▶產品特色</a></li>
                <li><a href="product.html#details">▶詳細說明</a></li>
                <li><a href="product.html#target">▶適用對象</a></li>
                <li><a href="product.html#guarantee">▶安心保證</a></li>
                <li><a href="product.html#faq">▶常見問題</a></li>
            </ul>
        </div>
        <div class="menu-item">
            <a class="menu-title" href="business.html">事業合作</a>
            <ul class="submenu-list">
                <li><a href="business.html#model">▶經營模式</a></li>

<div class="hero">
    <div class="slide active"><img src="https://lh3.googleusercontent.com/d/19AGk_oMvKPdF45nN0N_NlRQOCARsNeHs"></div>
    <div class="slide"><img src="https://lh3.googleusercontent.com/d/17-QAD7TE_7rX8FPSbcnzMSYzXWiZg4dZ"></div>
    <div class="slide"><img src="https://lh3.googleusercontent.com/d/1rtHyeCgFksEemspdWXtfwALyfXVc8WHC"></div>
    <div class="slide"><img src="https://lh3.googleusercontent.com/d/1xr89uvt3fWonS9bB-GIKl5Xcvf9JYj5a"></div>

    <div class="arrow left" onclick="prevSlide()">‹</div>
    <div class="arrow right" onclick="nextSlide()">›</div>
</div>

<footer style="text-align:center; padding:50px;">© 2026 動元力國際 版權所有</footer>

<script>
    setTimeout(() => { document.getElementById("splash").classList.add("fade-out"); }, 2000);

    let currentIndex = 0;
    const slides = document.querySelectorAll(".slide");
    function showSlide(n) {
        slides.forEach(s => s.classList.remove("active"));
        slides[n].classList.add("active");
    }
    function nextSlide() { currentIndex = (currentIndex + 1) % slides.length; showSlide(currentIndex); }
    function prevSlide() { currentIndex = (currentIndex - 1 + slides.length) % slides.length; showSlide(currentIndex); }
    
    setInterval(nextSlide, 4000);

    const hamburger = document.getElementById("hamburger");
    const menuTitles = document.getElementById("menu-titles");
    hamburger.addEventListener("click", () => menuTitles.classList.toggle("active"));

    document.querySelectorAll(".menu-item > .menu-title").forEach(title => {
        title.addEventListener("click", function(e) {
            if (window.innerWidth <= 992) {
                const parent = this.parentElement;
                if (parent.querySelector(".submenu-list")) {
                    e.preventDefault();
                    parent.classList.toggle("open");
                }
            }
        });
    });
</script>
