<style>
    /* 基礎設定 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
        font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
        background-color: #f8f9f8;
        color: #333;

        overflow-x: hidden; 
    }
    a { text-decoration: none; }

    /* ===== 開場動畫：適應螢幕不裁切 ===== */
    #splash {
        position: fixed;
        top: 0; left: 0; 
        width: 100vw; height: 100vh;
        background: #fff;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #splash img {
        width: 100vw;
        height: 100vh;
        object-fit: fill; /* 適應螢幕滿版，不裁切 */
    }
    #splash.fade-out { opacity: 0; visibility: hidden; }

    /* ===== Header (固定) ===== */
    #header-top {
        position: sticky; top: 0; z-index: 3000;
        height: 72px; background: #e5e5e5;
        display: flex; align-items: center; justify-content: center;
    }
    #header-top .left-icon { position: absolute; left: 12px; }
    #header-top .logo img { max-height: 42px; width: auto; display: block; }
    #header-top .hamburger { color: #5b5959; font-size: 28px; cursor: pointer; user-select: none; }

    /* ===== 主選單 (固定) ===== */
    #menu-titles {
        position: sticky; top: 72px; z-index: 2900;
        background: #a59e8a; backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .menu-inner {
        max-width: 1280px; margin: 0 auto;
        display: flex; justify-content: center; gap: 15px;
    }
    .menu-item { position: relative; }
    .menu-title {
        display: block; color: #fff; padding: 12px 14px; font-size: 17px;
        white-space: nowrap; transition: background 0.3s;
    }
    .menu-title:hover { background: rgba(255,255,255,0.1); }

    .submenu-list {
        list-style: none; position: absolute; top: 100%; left: 0;
        background: #a59e8a; min-width: 180px;
        opacity: 0; visibility: hidden; transform: translateY(10px);
        transition: 0.3s ease;
    }
    .menu-item:hover .submenu-list { opacity: 1; visibility: visible; transform: translateY(0); }
    .submenu-list li a {
        display: block; color: #fff; padding: 11px 16px; font-size: 16px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }

    /* ===== 輪播圖：左右拉伸滿版，高度壓扁 80% ===== */
    .hero {
        position: relative;
        width: 100vw;
        height: 80vh; /* 螢幕高度 80% */
        overflow: hidden;
        background: #000;
    }
    .slide {
        position: absolute; /* 修正為絕對定位以利淡入淡出 */
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: none;
        opacity: 0;
        transition: opacity 1.2s ease-in-out;
    }
    .slide.active {
        display: block;
        opacity: 1;
    }
    .slide img {
        width: 100%;
        height: 100%;
        object-fit: fill; /* 強制拉伸滿版，壓扁至 80vh */
        display: block;
    }

    .arrow {
        position: absolute; top: 50%; transform: translateY(-50%);
        background: rgba(0,0,0,0.2); color: #fff; font-size: 35px;
        width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
        cursor: pointer; z-index: 10; border-radius: 50%;
    }
    .arrow.left { left: 15px; }
    .arrow.right { right: 15px; }

    @media (max-width: 992px) {
        .menu-inner { display: none; flex-direction: column; width: 100%; }
        #menu-titles.active .menu-inner { display: flex; }
        .submenu-list { position: static; display: none; opacity: 1; visibility: visible; }
        .menu-item.open .submenu-list { display: block; }
    }
</style>
</head>

<script>
    setTimeout(() => {
        const splash = document.getElementById("splash");
        if(splash) splash.classList.add("fade-out");
    }, 2000);

    let currentIndex = 0;
    const slides = document.querySelectorAll(".slide");

    function showSlide(n) {
        slides.forEach(s => {
            s.style.display = 'none';
            s.classList.remove("active");
        });
        slides[n].style.display = 'block';
        setTimeout(() => {
            slides[n].classList.add("active");
        }, 10);
    }

    function nextSlide() {
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide(currentIndex);
    }

    function prevSlide() {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        showSlide(currentIndex);
    }

    showSlide(currentIndex);
    setInterval(nextSlide, 4000);

    const hamburger = document.getElementById("hamburger");
    const menuTitles = document.getElementById("menu-titles");
    hamburger.addEventListener("click", () => {
        menuTitles.classList.toggle("active");
    });

    document.querySelectorAll(".menu-item > .menu-title").forEach(title => {
        title.addEventListener("click", function(e) {
            if (window.innerWidth <= 992) {
                const parent = this.parentElement;
                const submenu = parent.querySelector(".submenu-list");
                if (submenu) {
                    e.preventDefault();
                    parent.classList.toggle("open");
                }
            }
        });
    });
</script>
