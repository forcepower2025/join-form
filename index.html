<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動元力國際</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft JhengHei",sans-serif;overflow-x:hidden;}

/* ===== 開場圖 ===== */
#splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #fff;
}

#splash img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.fade-out{
    animation: fadeOut 1s forwards;
}

@keyframes fadeOut{
    to{opacity:0;visibility:hidden;}
}

/* ===== Header ===== */
#header-top{
    position:sticky;
    top:0;
    z-index:3000;
    height:72px;
    background:#e5e5e5;
    display:flex;
    align-items:center;
    justify-content:center;
}

.left-icon{
    position:absolute;
    left:12px;
}

.logo img{
    height:42px;
}

/* ===== 選單 ===== */
#menu-titles{
    position:sticky;
    top:72px;
    z-index:2900;
    background:#a59e8a;
}

.menu-inner{
    display:flex;
    justify-content:center;
    gap:30px;
}

.menu-title{
    color:#fff;
    padding:10px 14px;
}

/* ===== 輪播 ===== */
.hero{
    position:relative;
    width:100%;
    height:80vh;
    overflow:hidden;
}

.slide{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 1s;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.slide.active{
    opacity:1;
}

/* 左右按鈕 */
.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:30px;
    color:#fff;
    background:rgba(0,0,0,0.3);
    padding:10px;
    cursor:pointer;
}

.arrow.left{left:10px;}
.arrow.right{right:10px;}

</style>
</head>

<body>

<!-- ===== 開場 ===== -->
<div id="splash">
    <picture>
        <source media="(max-width:768px)" 
        srcset="https://lh3.googleusercontent.com/d/1DOC0H23-wYiFrpwLo2bAQYMj-LW79fTr">
        <img src="https://lh3.googleusercontent.com/d/13vmEyVCkGkC3FIMphgCCqUPeq3LX-r2x">
    </picture>
</div>

<!-- Header -->
<header id="header-top">
    <div class="left-icon">
        <div id="hamburger">☰</div>
    </div>
    <a class="logo" href="#">
        <img src="https://lh3.googleusercontent.com/d/1pLB5WF3lUy3zz7gLvaTBKaARo6BULVZ-">
    </a>
</header>

<!-- 選單 -->
<div id="menu-titles">
    <div class="menu-inner">
        <a class="menu-title" href="about.html">關於公司</a>
        <a class="menu-title" href="product.html">產品介紹</a>
        <a class="menu-title" href="business.html">事業合作</a>
        <a class="menu-title" href="news.html">最新消息</a>
        <a class="menu-title" href="contact.html">聯絡我們</a>
        <a class="menu-title" href="apply.html" target="_blank">加入我們</a>
        <a class="menu-title" href="login.html" target="_blank">登入會員</a>
    </div>
</div>

<!-- ===== 輪播 ===== -->
<div class="hero">

    <div class="slide active">
        <img src="https://lh3.googleusercontent.com/d/19AGk_oMvKPdF45nN0N_NlRQOCARsNeHs">
    </div>

    <div class="slide">
        <img src="https://lh3.googleusercontent.com/d/17-QAD7TE_7rX8FPSbcnzMSYzXWiZg4dZ">
    </div>

    <div class="slide">
        <img src="https://lh3.googleusercontent.com/d/1rtHyeCgFksEemspdWXtfwALyfXVc8WHC">
    </div>

    <div class="slide">
        <img src="https://lh3.googleusercontent.com/d/1xr89uvt3fWonS9bB-GIKl5Xcvf9JYj5a">
    </div>

    <div class="slide">
        <img src="https://lh3.googleusercontent.com/d/1b_UaS9fiQIvctOFwSUvJmJw23ARv431B">
    </div>

    <div class="arrow left" onclick="prevSlide()">‹</div>
    <div class="arrow right" onclick="nextSlide()">›</div>

</div>

<script>

/* ===== 開場淡出 ===== */
setTimeout(()=>{
    document.getElementById("splash").classList.add("fade-out");
},2000);

/* ===== 輪播 ===== */
let index=0;
const slides=document.querySelectorAll(".slide");

function showSlide(i){
    slides.forEach(s=>s.classList.remove("active"));
    slides[i].classList.add("active");
}

function nextSlide(){
    index=(index+1)%slides.length;
    showSlide(index);
}

function prevSlide(){
    index=(index-1+slides.length)%slides.length;
    showSlide(index);
}

/* 自動播放 */
setInterval(nextSlide,4000);

</script>

</body>
</html>
