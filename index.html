<style>
    /* 基礎設定 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
        font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
        background-color: #f8f9f8;
        color: #333;
        line-height: 1.6;
        overflow-x: hidden; 
    }
    a { text-decoration: none; }

    /* ===== 開場動畫：適應螢幕不裁切 ===== */
    #splash {
        position: fixed;
        top: 0; left: 0; 
        width: 100vw; height: 100vh;
        background: #fff;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    /* ===== 開場圖背景 (徹底模糊邊緣) ===== */
    #splash img.splash-bg {
    position: absolute;
    top: -10vh; left: -10vw; /* 往外擴大 */
    width: 120vw; height: 120vh; /* 比螢幕大 */
    object-fit: cover;
    
    /* 關鍵 1：極限模糊 + 降低亮度 */
    filter: blur(60px) brightness(0.7) saturate(1.3); /* 提高模糊度 */
    
    /* 關鍵 2：羽化遮罩 (讓四周慢慢變透明) */
    -webkit-mask-image: radial-gradient(circle, black 50%, transparent 85%);
    mask-image: radial-gradient(circle, black 50%, transparent 85%);
    
    z-index: 1;
}
    

/* ===== 原本的 #splash img 修改為：中央清晰主圖 ===== */
#splash img:not(.splash-bg) {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* 絕對居中 */
    
    width: 85vw;  /* 不要滿版，留出空間看背景的模糊羽化 */
    height: auto; /* 保持比例，不變形 */
    max-height: 70vh;
    
    object-fit: contain; /* 確保主圖完整顯示 */
    z-index: 2; /* 必須大於背景的 z-index: 1 */
    
    /* 選擇性：給主圖一點點陰影，讓它從模糊背景中跳出來 */
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
}

    
    #splash.fade-out { opacity: 0; visibility: hidden; }

    /* ===== Header (固定) ===== */
    #header-top {
        position: sticky; top: 0; z-index: 3000;
        height: 72px; background: #e5e5e5;
        display: flex; align-items: center; justify-content: center;
    }
    #header-top .left-icon { position: absolute; left: 12px; }
    #header-top .logo img { max-height: 42px; width: auto; display: block; }
    #header-top .hamburger { color: #5b5959; font-size: 28px; cursor: pointer; user-select: none; }

    /* ===== 主選單 (固定) ===== */
    #menu-titles {
        position: sticky; top: 72px; z-index: 2900;
        background: #a59e8a; backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .menu-inner {
        max-width: 1280px; margin: 0 auto;
        display: flex; justify-content: center; gap: 15px;
    }
    .menu-item { position: relative; }
    .menu-title {
        display: block; color: #fff; padding: 12px 14px; font-size: 17px;
        white-space: nowrap; transition: background 0.3s;
    }
    .menu-title:hover { background: rgba(255,255,255,0.1); }

    .submenu-list {
        list-style: none; position: absolute; top: 100%; left: 0;
        background: #a59e8a; min-width: 180px;
        opacity: 0; visibility: hidden; transform: translateY(10px);
        transition: 0.3s ease;
    }
    .menu-item:hover .submenu-list { opacity: 1; visibility: visible; transform: translateY(0); }
    .submenu-list li a {
        display: block; color: #fff; padding: 11px 16px; font-size: 16px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }

/* ===== 輪播圖容器 (限高 80vh) ===== */
.hero {
    position: relative;
    width: 100vw;
    height: 80vh; /* 鎖定高度 */
    overflow: hidden;
    background: #000; /* 底色 */
}
    
/* ===== 幻燈片容器 ===== */
.slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none; opacity: 0;
    transition: opacity 1.2s ease-in-out;
}
.slide.active { display: block; opacity: 1; }

/* ===== 1. 後面的背景圖片 (負責模糊填滿) ===== */
/* ===== 輪播圖背景 (徹底模糊邊緣) ===== */
.slide img.slide-bg {
    position: absolute;
    top: -10%; left: -10%; /* 往外擴大，確保邊緣被遮住 */
    width: 120%; height: 120%; /* 比容器大，給模糊和羽化空間 */
    object-fit: cover;
    
    /* 關鍵 1：極限模糊 + 降低亮度 */
    filter: blur(50px) brightness(0.6) saturate(1.2); /* 提高模糊度，稍微降低亮度，提高飽和度讓色彩更濃郁 */
    
    /* 關鍵 2：羽化遮罩 (讓四周慢慢變透明) */
    -webkit-mask-image: radial-gradient(circle, black 40%, transparent 80%);
    mask-image: radial-gradient(circle, black 40%, transparent 80%);
    
    z-index: 1;
    opacity: 0.9; /* 稍微透明，讓色彩更柔和 */
}

/* ===== 2. 前面的主角圖片 (負責完整顯示) ===== */
.slide img.slide-fg {
    position: relative;
    width: 100%; height: 100%;
    /* 關鍵 3：object-fit: contain 確保整張圖完整顯示，絕對不裁切 */
    object-fit: contain; 
    display: block;
    z-index: 2; /* 放在背景上面 */
}

    .arrow {
        position: absolute; top: 50%; transform: translateY(-50%);
        background: rgba(0,0,0,0.2); color: #fff; font-size: 35px;

    }
    .arrow.left { left: 15px; }
    .arrow.right { right: 15px; }

    /* ===== 手機選單 ===== */
    @media (max-width: 992px) {

        .submenu-list {

        .menu-item.open .submenu-list {

    @media (max-width: 768px) {

        .social {

        }

        .social a {
            min-width: calc(50% - 6px);
            font-size: 15px;
        }
    }
</style>

<script>
    setTimeout(() => {
        const splash = document.getElementById("splash");
        if(splash) splash.classList.add("fade-out");
    }, 2000);

    let currentIndex = 0;
    const slides = document.querySelectorAll(".slide");

    function showSlide(n) {
        slides.forEach(s => {
            s.style.display = 'none';
            s.classList.remove("active");
        });
        slides[n].style.display = 'block';
        setTimeout(() => {
            slides[n].classList.add("active");
        }, 10);
    }

    function nextSlide() {
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide(currentIndex);
    }

    function prevSlide() {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        showSlide(currentIndex);
    }

    showSlide(currentIndex);
    setInterval(nextSlide, 4000);

    const hamburger = document.getElementById("hamburger");
    const menuTitles = document.getElementById("menu-titles");
    hamburger.addEventListener("click", () => {
        menuTitles.classList.toggle("active");
    });


</script>
