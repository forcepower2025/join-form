<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動元力國際活動報名系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; }
        .dm-container { width: 100%; margin-bottom: 20px; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .dm-image { width: 100%; display: block; }
        .info-card { background: #ffffff; padding: 25px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 6px solid #4299e1; }
        .info-card h3 { margin-top: 0; color: #2d3748; font-size: 1.2em; border-bottom: 1px solid #edf2f7; padding-bottom: 10px; }
        .info-card p { color: #4a5568; line-height: 1.8; font-size: 0.95em; white-space: pre-wrap; margin-bottom: 0; }
        .form-card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); box-sizing: border-box; margin-bottom: 20px; }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 25px; font-size: 1.5em; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #4a5568; font-size: 0.9em; }
        input, select { width: 100%; padding: 14px 18px; border: 2px solid #edf2f7; border-radius: 14px; font-size: 16px; box-sizing: border-box; transition: all 0.3s; background-color: white; }
        input:focus, select:focus { outline: none; border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15); }
        input:disabled { background-color: #f7fafc; color: #a0aec0; cursor: not-allowed; }
        .submit-btn { width: 100%; padding: 16px; background-color: #4299e1; color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #msg { color: #e53e3e; font-size: 0.85em; margin-bottom: 15px; text-align: center; min-height: 1.2em; font-weight: bold; }
        #qrc-result { display: none; margin-top: 25px; text-align: center; border-top: 2px dashed #eee; padding-top: 25px; }
        #capture-area { background: white; padding: 20px; border-radius: 18px; }
        #qrcode { display: flex; justify-content: center; margin-bottom: 15px; }
        .download-btn { background: #48bb78; color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="dm-container">
            <img src="https://drive.google.com/thumbnail?id=1k0Hb8GJM3eje2mQYiT-mH-vWIFJexCaG&sz=w1000" alt="課程海報" class="dm-image">
        </div>

        <div class="info-card">
            <h3>📖 報名須知</h3>
            <p>感謝您的參與！請選擇報名場次並輸入手機號碼進行確認。

⚠️ 注意事項：報名完成後請下載 QR Code 憑證於現場出示。</p>
        </div>

        <div class="form-card">
            <h2>即刻報名</h2>
            <div id="msg"></div>

            <div class="form-group">
                <label>選擇報名場次</label>
                <select id="dateSelect">
                    <option value="">載入場次中...</option>
                </select>
            </div>

            <div class="form-group">
                <label>手機號碼</label>
                <input type="tel" id="phone" placeholder="輸入 10 碼手機自動查詢" oninput="autoCheck(this.value)" inputmode="numeric" pattern="[0-9]*">
            </div>

            <div class="form-group">
                <label>學員姓名</label>
                <input type="text" id="name" placeholder="輸入手機後自動顯示" disabled>
            </div>

            <div class="form-group">
                <label>介紹人姓名</label>
                <input type="text" id="referrer" placeholder="輸入手機後自動顯示" disabled>
            </div>

            <div class="form-group">
                <label>介紹人手機</label>
                <input type="tel" id="introPhone" placeholder="輸入手機後自動顯示" disabled>
            </div>

            <button onclick="submitRegistration()" class="submit-btn" id="btn-text">確認報名</button>

            <div id="qrc-result">
                <div id="capture-area">
                    <div id="qrcode"></div>
                    <h3 id="display-name" style="margin: 10px 0;"></h3>
                    <p id="display-date" style="font-size: 1em; font-weight: bold; color: #4299e1; margin-bottom: 5px;"></p>
                    <p style="font-size: 0.9em; color: #666;">您已完成報名，<br>請於報到時出示此圖掃瞄簽到</p>
                </div>
                <button class="download-btn" onclick="downloadImage()">下載報到憑證圖片</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzzC1Z8g5EaXe-6KRK7eCNc7PMYbiqAhat13iG9EqlHiHx8kyjYcjxiic7rGkcoE9_6Gw/exec"; 

        // 1. 初始化抓取日期與網址參數
        window.onload = async function() {
            await fetchDates(); // 優先抓取選單日期
            
            const urlParams = new URLSearchParams(window.location.search);
            const refName = urlParams.get('ref');
            const refPhone = urlParams.get('refp');

            if (refName) {
                document.getElementById('referrer').value = decodeURIComponent(refName);
                document.getElementById('referrer').disabled = true;
            }
            if (refPhone) {
                document.getElementById('introPhone').value = refPhone;
                document.getElementById('introPhone').disabled = true;
            }
        };

        // 2. 自動抓取 GAS 的日期選單
        async function fetchDates() {
            const dateSelect = document.getElementById('dateSelect');
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getDates' })
                });
                const result = await res.json();
                if (result.result === 'success' && result.dates.length > 0) {
                    dateSelect.innerHTML = ''; 
                    result.dates.forEach(date => {
                        const opt = document.createElement('option');
                        opt.value = date;
                        opt.innerText = date.toString().replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
                        dateSelect.appendChild(opt);
                    });
                } else {
                    dateSelect.innerHTML = '<option value="">目前無開放場次</option>';
                }
            } catch (e) {
                dateSelect.innerHTML = '<option value="">連線場次失敗</option>';
            }
        }

        // 3. 自動偵測輸入長度與純數字限制
        function autoCheck(val) {
            const phoneInput = document.getElementById('phone');
            // 只保留數字
            let cleanVal = val.replace(/\D/g, '');
            
            // 限制 10 碼
            if (cleanVal.length > 10) cleanVal = cleanVal.slice(0, 10);
            phoneInput.value = cleanVal;

            if (cleanVal.length === 10) {
                checkUser(cleanVal);
            } 
        }

        // 4. 查詢學員身分
        async function checkUser(phone) {
            const selectedDate = document.getElementById('dateSelect').value;
            if(!selectedDate) {
                alert("請先選擇報名場次");
                return;
            }

            document.getElementById('msg').innerText = "系統查詢中...";
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'checkUser', phone: phone, courseDate: selectedDate })
                });
                const user = await res.json();

                const nameField = document.getElementById('name');
                const refField = document.getElementById('referrer');
                const refPhoneField = document.getElementById('introPhone');

                if (user.exists) {
                    const currentRefName = refField.value.trim();
                    const dbRefName = (user.referrer || "").toString().trim();

                    if (currentRefName !== "" && dbRefName !== "" && currentRefName !== dbRefName) {
                        alert("您已綁定介紹人為 " + dbRefName + "，如需更換介紹人，請聯絡公司客服line");
                    }

                    nameField.value = user.name;
                    nameField.disabled = true;
                    
                    if (dbRefName !== "") {
                        refField.value = dbRefName;
                        refField.disabled = true;
                        refPhoneField.value = user.referrerPhone || "";
                        refPhoneField.disabled = true;
                    }
                    
                    document.getElementById('msg').innerText = "";

                    if (user.status === "已報名" || user.status === "已報到") {
                        alert("您已經報名過本場次囉！");
                        showQRCode(user.name, phone, selectedDate);
                    }
                } else {
                    document.getElementById('msg').innerText = "第一次報名，請填寫完整資訊";
                    nameField.value = "";
                    nameField.disabled = false;
                    if (!refField.disabled) {
                        refField.value = "";
                        refField.disabled = false;
                        refPhoneField.value = "";
                        refPhoneField.disabled = false;
                    }
                    nameField.focus(); 
                }
            } catch (e) {
                document.getElementById('msg').innerText = "查詢失敗";
            }
        }

        // 5. 提交報名
        async function submitRegistration() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const referrer = document.getElementById('referrer').value;
            const introPhone = document.getElementById('introPhone').value;
            const selectedDate = document.getElementById('dateSelect').value;

            if (!name || phone.length < 10 || !referrer || !introPhone || !selectedDate) {
                alert("請填寫完整資訊");
                return;
            }

            document.getElementById('btn-text').innerText = "處理中...";
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'register',
                        name: name,
                        phone: phone,
                        referrer: referrer,
                        introPhone: introPhone, 
                        courseDate: selectedDate
                    })
                });
                const result = await res.json();
                if (result.result === 'success') {
                    showQRCode(name, phone, selectedDate);
                    document.getElementById('btn-text').innerText = "報名成功";
                }
            } catch (e) {
                alert("報名失敗");
                document.getElementById('btn-text').innerText = "確認報名";
            }
        }

        // 6. 產生 QR Code (加入日期顯示)
        function showQRCode(name, phone, date) {
            document.getElementById('qrc-result').style.display = 'block';
            document.getElementById('display-name').innerText = name;
            document.getElementById('display-date').innerText = "場次日期：" + date.toString().replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
            document.getElementById('qrcode').innerHTML = "";

            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const rand1 = letters.charAt(Math.floor(Math.random() * letters.length)) + letters.charAt(Math.floor(Math.random() * letters.length));
            const rand2 = letters.charAt(Math.floor(Math.random() * letters.length));
            const timestamp = new Date().getTime().toString().slice(-4);
            const content = `${rand1}${phone}${rand2}${date}${timestamp}`;

            new QRCode(document.getElementById("qrcode"), {
                text: content,
                width: 180,
                height: 180,
                correctLevel : QRCode.CorrectLevel.H
            });
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        // 7. 下載憑證
        function downloadImage() {
            const area = document.getElementById('capture-area');
            const name = document.getElementById('name').value;
            html2canvas(area, { scale: 3 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `課程憑證_${name}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
