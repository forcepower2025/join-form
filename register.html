<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程報名</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background-color: #f4f7f9; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; width: 100%; max-width: 420px; padding: 35px; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); box-sizing: border-box; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 30px; letter-spacing: 1px; }
        .form-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #4a5568; font-size: 0.95em; }
        input { width: 100%; padding: 14px 18px; border: 2px solid #edf2f7; border-radius: 14px; font-size: 16px; box-sizing: border-box; transition: all 0.3s ease; background-color: #fff; }
        input:focus { outline: none; border-color: #4299e1; background-color: #fff; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15); }
        input:disabled { background-color: #f7fafc; color: #a0aec0; cursor: not-allowed; border-color: #edf2f7; }
        .submit-btn { width: 100%; padding: 16px; background-color: #4299e1; color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.3s; }
        .submit-btn:hover { background-color: #3182ce; }
        #msg { color: #e53e3e; font-size: 0.9em; margin-bottom: 18px; text-align: center; min-height: 1.5em; font-weight: 500; }
        #qrc-result { display: none; margin-top: 30px; text-align: center; border-top: 2px dashed #e2e8f0; padding-top: 30px; }
        #capture-area { background: white; padding: 20px; border-radius: 18px; }
        #qrcode { display: flex; justify-content: center; margin-bottom: 20px; }
        .download-btn { background: #48bb78; color: white; border: none; padding: 14px 28px; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 20px; width: 100%; }
    </style>
</head>
<body>

    <div class="card">
        <h2>課程報名</h2>
        <div id="msg"></div>

        <div class="form-group">
            <label>手機號碼</label>
            <input type="tel" id="phone" placeholder="請輸入手機號碼" onblur="checkUser(this.value)">
        </div>

        <div class="form-group">
            <label>學員姓名</label>
            <input type="text" id="name" placeholder="輸入手機後自動顯示" disabled>
        </div>

        <div class="form-group">
            <label>介紹人</label>
            <input type="text" id="referrer" placeholder="輸入手機後自動顯示" disabled>
        </div>

        <button onclick="submitRegistration()" class="submit-btn" id="btn-text">確認報名</button>

        <div id="qrc-result">
            <div id="capture-area">
                <div id="qrcode"></div>
                <h3 id="display-name" style="margin: 15px 0; color: #2d3748;"></h3>
                <p style="font-size: 0.95em; color: #718096; line-height: 1.6;">您已完成報名，<br>請於報到時出示此圖掃瞄簽到</p>
            </div>
            <button class="download-btn" onclick="downloadImage()">保存報到憑證圖片</button>
        </div>
    </div>

    <script>
        // --- 請更換為您的 GAS 網址 ---
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzzC1Z8g5EaXe-6KRK7eCNc7PMYbiqAhat13iG9EqlHiHx8kyjYcjxiic7rGkcoE9_6Gw/exec"; 
        const COURSE_DATE = "20260225"; 

        async function checkUser(phone) {
            if (!phone) return;
            document.getElementById('msg').innerText = "系統查詢中...";
            
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'checkUser', phone: phone, courseDate: COURSE_DATE })
                });
                const user = await res.json();

                if (user.exists) {
                    // 舊學員邏輯：填入資料並鎖定
                    document.getElementById('name').value = user.name;
                    document.getElementById('name').disabled = true;
                    document.getElementById('referrer').value = user.referrer;
                    document.getElementById('referrer').disabled = true;
                    document.getElementById('msg').innerText = "";

                    if (user.status === "已報名" || user.status === "已報到完成") {
                        alert("您已經報名過囉！");
                        showQRCode(user.name, phone);
                    }
                } else {
                    // 新學員邏輯：清空並解鎖
                    document.getElementById('msg').innerText = "您為第一次報名，請填寫姓名與介紹人";
                    document.getElementById('name').value = "";
                    document.getElementById('name').disabled = false;
                    document.getElementById('referrer').value = "";
                    document.getElementById('referrer').disabled = false;
                }
            } catch (e) {
                document.getElementById('msg').innerText = "連線失敗，請檢查網路或 GAS 設定";
            }
        }

        async function submitRegistration() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const referrer = document.getElementById('referrer').value;

            if (!name || !phone || !referrer) {
                alert("請填寫完整資訊");
                return;
            }

            document.getElementById('btn-text').innerText = "報名處理中...";
            
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'register',
                        name: name,
                        phone: phone,
                        referrer: referrer,
                        courseDate: COURSE_DATE
                    })
                });
                const result = await res.json();
                if (result.result === 'success') {
                    showQRCode(name, phone);
                    document.getElementById('btn-text').innerText = "報名成功";
                }
            } catch (e) {
                alert("提交失敗，請重試");
                document.getElementById('btn-text').innerText = "確認報名";
            }
        }

        function showQRCode(name, phone) {
            document.getElementById('qrc-result').style.display = 'block';
            document.getElementById('display-name').innerText = name;
            document.getElementById('qrcode').innerHTML = "";

            // 生成加密字串
            const rand1 = Math.random().toString(36).substring(2, 4).toUpperCase();
            const rand2 = Math.random().toString(36).substring(2, 3).toUpperCase();
            const timestamp = new Date().getTime().toString().slice(-4);
            const content = `${rand1}${phone}${rand2}${COURSE_DATE}${timestamp}`;

            new QRCode(document.getElementById("qrcode"), {
                text: content,
                width: 200,
                height: 200,
                colorDark : "#2d3748",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function downloadImage() {
            const area = document.getElementById('capture-area');
            html2canvas(area, { scale: 3 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `報到憑證_${document.getElementById('name').value}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
