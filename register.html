<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動元力國際報名系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        
        .container { width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; }

        /* 1. DM 圖片區 */
        .dm-container { width: 100%; margin-bottom: 20px; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .dm-image { width: 100%; display: block; }

        /* 2. 文字說明 Card */
        .info-card { background: #ffffff; padding: 25px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 6px solid #4299e1; }
        .info-card h3 { margin-top: 0; color: #2d3748; font-size: 1.2em; border-bottom: 1px solid #edf2f7; padding-bottom: 10px; }
        .info-card p { color: #4a5568; line-height: 1.8; font-size: 0.95em; white-space: pre-wrap; margin-bottom: 0; }

        /* 3. 報名表單 Card */
        .form-card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); box-sizing: border-box; margin-bottom: 20px; }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 25px; font-size: 1.5em; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #4a5568; font-size: 0.9em; }
        input { width: 100%; padding: 14px 18px; border: 2px solid #edf2f7; border-radius: 14px; font-size: 16px; box-sizing: border-box; transition: all 0.3s; }
        input:focus { outline: none; border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15); }
        input:disabled { background-color: #f7fafc; color: #a0aec0; cursor: not-allowed; }

        .submit-btn { width: 100%; padding: 16px; background-color: #4299e1; color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .submit-btn:hover { background-color: #3182ce; }

        #msg { color: #e53e3e; font-size: 0.85em; margin-bottom: 15px; text-align: center; min-height: 1.2em; font-weight: bold; }

        /* 4. Google 地圖區 */
        .map-card { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 40px; overflow: hidden; }
        .map-container { position: relative; padding-bottom: 75%; height: 0; overflow: hidden; border-radius: 12px; }
        .map-container iframe { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; border: 0; }

        /* QR Code 結果顯示 */
        #qrc-result { display: none; margin-top: 25px; text-align: center; border-top: 2px dashed #eee; padding-top: 25px; }
        #capture-area { background: white; padding: 20px; border-radius: 18px; }
        #qrcode { display: flex; justify-content: center; margin-bottom: 15px; }
        .download-btn { background: #48bb78; color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="dm-container">
            <img src="https://lh3.googleusercontent.com/d/1hpOvyW86lt2VRbDnZBVCgA-denPpvDDi" alt="課程海報" class="dm-image">
        </div>

        <div class="info-card">
            <h3>📖 報名須知</h3>
            <p>感謝您的參與！請輸入手機號碼進行身分確認。如果是首次報名，請協助填寫姓名與介紹人。

📅 活動日期：2026年02月25日
⏰ 活動時間：下午２點                
📍 活動地點：請參考下方地圖導覽
⚠️ 注意事項：報名完成後請截圖或下載 QR Code 憑證。</p>
        </div>

        <div class="form-card">
            <h2>即刻報名</h2>
            <div id="msg"></div>

            <div class="form-group">
                <label>手機號碼</label>
                <input type="tel" id="phone" placeholder="輸入 10 碼手機自動查詢" oninput="autoCheck(this.value)">
            </div>

            <div class="form-group">
                <label>學員姓名</label>
                <input type="text" id="name" placeholder="輸入手機後自動顯示" disabled>
            </div>

            <div class="form-group">
                <label>介紹人姓名</label>
                <input type="text" id="referrer" placeholder="輸入手機後自動顯示" disabled>
            </div>

            <div class="form-group">
                <label>介紹人手機</label>
                <input type="tel" id="introPhone" placeholder="輸入手機後自動顯示" disabled>
            </div>

            <button onclick="submitRegistration()" class="submit-btn" id="btn-text">確認報名</button>

            <div id="qrc-result">
                <div id="capture-area">
                    <div id="qrcode"></div>
                    <h3 id="display-name" style="margin: 10px 0;"></h3>
                    <p style="font-size: 0.9em; color: #666;">您已完成報名，<br>請於報到時出示此圖掃瞄簽到</p>
                </div>
                <button class="download-btn" onclick="downloadImage()">下載報到憑證圖片</button>
            </div>
        </div>

        <div class="map-card">
            <label style="margin-bottom: 10px; display: block; font-weight: bold; color: #555;">📍 活動地點</label>
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3614.647276601334!2d121.519626860567!3d25.0460416094302!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442a972222f6c45%3A0x79fd56661170c0b0!2zMTAw6Ie65YyX5biC5Lit5q2j5Y2A5Lit5bGx5YyX6Lev5LiA5q61MuiZn-S4reWkruWkp-aokw!5e0!3m2!1szh-TW!2stw!4v1771872010582!5m2!1szh-TW!2stw" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px; padding-bottom: 40px;">
    <a href="https://lin.ee/HlcqleG" target="_blank">
        <img src="https://drive.google.com/thumbnail?id=1k0Hb8GJM3eje2mQYiT-mH-vWIFJexCaG&sz=w500" alt="客服中心" style="width: 100%; max-width: 400px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    </a>
</div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzzC1Z8g5EaXe-6KRK7eCNc7PMYbiqAhat13iG9EqlHiHx8kyjYcjxiic7rGkcoE9_6Gw/exec"; 
        const COURSE_DATE = "20260225"; 

        // --- 在 window.onload 加入讀取網址參數 ---
window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const refName = urlParams.get('ref');
    const refPhone = urlParams.get('refp');

    if (refName) {
        document.getElementById('referrer').value = decodeURIComponent(refName);
        document.getElementById('referrer').disabled = true;
    }
    if (refPhone) {
        document.getElementById('introPhone').value = refPhone;
        document.getElementById('introPhone').disabled = true;
    }
};

        // 自動偵測輸入長度
       // 自動偵測輸入長度：每打一個字都會執行此函式
function autoCheck(val) {
    // 1. 直接取得輸入框原始字串 (不要做任何 replace 動作，避免 0 消失)
    const phoneInput = document.getElementById('phone');
    const currentVal = phoneInput.value;

    // 2. 判斷如果長度剛好等於 10，就執行查詢
    if (currentVal.length === 10) {
        checkUser(currentVal);
    } 
    // 3. 如果超過 10 碼，自動截斷 (維持 10 碼)
    else if (currentVal.length > 10) {
        phoneInput.value = currentVal.slice(0, 10);
    }
}

async function checkUser(phone) {
            document.getElementById('msg').innerText = "系統查詢中...";
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'checkUser', phone: phone, courseDate: COURSE_DATE })
                });
                const user = await res.json();

                const nameField = document.getElementById('name');
                const refField = document.getElementById('referrer');
                const refPhoneField = document.getElementById('introPhone');

                if (user.exists) {
                    // --- 舊學員警示邏輯開始 ---
                    // 如果這名學員原本就有介紹人資料
                    if (user.referrer) {
                        // 1. 跳出訊息視窗
                        alert("您已綁定介紹人為 " + user.referrer + "，如需更換介紹人，請聯絡公司客服line");
                        
                        // 2. 強制將欄位填入舊資料 (不管網址帶什麼參數，都要以舊資料為準)
                        refField.value = user.referrer;
                        refPhoneField.value = user.referrerPhone || "";
                    }
                    
                    // 3. 鎖定所有欄位
                    nameField.value = user.name;
                    nameField.disabled = true;
                    refField.disabled = true;
                    refPhoneField.disabled = true;
                    // --- 舊學員警示邏輯結束 ---

                    document.getElementById('msg').innerText = "";

                    // 若已報名過，則顯示 QRC
                    if (user.status === "已報名" || user.status === "已報到完成") {
                        alert("您已經報名過囉！");
                        showQRCode(user.name, phone);
                    }
                } else {
                    // 這裡是新學員的邏輯 (維持現狀)
                    document.getElementById('msg').innerText = "您為第一次報名，請填寫完整資訊";
                    nameField.value = "";
                    nameField.disabled = false;
                    
                    // 注意：如果是點邀約連結進來的新學員，這兩個欄位在 window.onload 已經鎖定了
                    // 只有在「非點連結進來」的新學員，才會解鎖介紹人欄位
                    if (!refField.disabled) {
                        refField.value = "";
                        refField.disabled = false;
                        refPhoneField.value = "";
                        refPhoneField.disabled = false;
                    }
                    nameField.focus(); 
                }
            } catch (e) {
                document.getElementById('msg').innerText = "查詢失敗";
            }
        }

        async function submitRegistration() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const referrer = document.getElementById('referrer').value;
            const introPhone = document.getElementById('introPhone').value;

            if (!name || phone.length < 10 || !referrer || !introPhone) {
                alert("請填寫完整資訊（手機須為10碼）");
                return;
            }

            document.getElementById('btn-text').innerText = "處理中...";
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'register',
                        name: name,
                        phone: phone,
                        referrer: referrer,
                        introPhone: introPhone, 
                        courseDate: COURSE_DATE
                    })
                });
                const result = await res.json();
                if (result.result === 'success') {
                    showQRCode(name, phone);
                    document.getElementById('btn-text').innerText = "報名成功";
                }
            } catch (e) {
                alert("報名失敗");
                document.getElementById('btn-text').innerText = "確認報名";
            }
        }

        function showQRCode(name, phone) {
            document.getElementById('qrc-result').style.display = 'block';
            document.getElementById('display-name').innerText = name;
            document.getElementById('qrcode').innerHTML = "";

            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const rand1 = letters.charAt(Math.floor(Math.random() * letters.length)) + 
                          letters.charAt(Math.floor(Math.random() * letters.length));
            const rand2 = letters.charAt(Math.floor(Math.random() * letters.length));
            const timestamp = new Date().getTime().toString().slice(-4);
            const content = `${rand1}${phone}${rand2}${COURSE_DATE}${timestamp}`;

            new QRCode(document.getElementById("qrcode"), {
                text: content,
                width: 180,
                height: 180,
                correctLevel : QRCode.CorrectLevel.H
            });
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function downloadImage() {
            const area = document.getElementById('capture-area');
            html2canvas(area, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `課程報名碼_${document.getElementById('name').value}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
