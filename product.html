
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動元活力蔬果餐包|GM-67</title>
    <style>
        /* 基礎樣式設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            background-color: #f8f9f8;
            color: #333;
            line-height: 1.6;
        }

        /* 外層容器：確保在各裝置上的間距與寬度 */
        .wrapper {
            width: 100%;
            max-width: 1200px; /* 電腦版最大寬度 */
            margin: 0 auto;
            padding: 20px;
        }

        /* 圖片容器 */
        .image-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        /* RWD 圖片關鍵設定 */
.responsive-img {
    display: block;
    width: 100%;
    height: auto;
/* 強化圖片清晰度 */
    image-rendering: -webkit-optimize-contrast;
    image-rendering: high-quality;
}

        /* 文案樣式 */
        .content-section {
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #2e7d32; /* 品牌綠色 */
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 1rem;
        }

        /* 手機版微調 */
        @media (max-width: 768px) {
            .wrapper {
                padding: 10px;
            }
            .content-section {
                padding: 20px 15px;
            }
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="image-card">
            <img src="https://lh3.googleusercontent.com/d/1FagClCsNPGstHBqCngz1w3LgrFvWvXFI=s0" 
                 alt="動元活力 GM-67 產品詳情圖" 
                 class="responsive-img">
            
            <div class="content-section">
                
            </div>
        </div>
    </div>

    <footer>
        <img src="https://lh3.googleusercontent.com/d/1xvNsSNKezzuXixviQLTJokSUtcIxxDZF=s0" alt="動元活力" class="footer-logo">
        <p>© 2026 動元活力國際 版權所有</p>
    </footer>

</body>
</html>
