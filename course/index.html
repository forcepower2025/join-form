
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課程報名｜動元力國際</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei",Arial,sans-serif;background:#f6f8f6;color:#26352a;line-height:1.6}
.wrapper{max-width:760px;margin:40px auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{text-align:center;font-size:32px;color:#0b3d1f;margin-bottom:8px;letter-spacing:2px}
.subtitle{text-align:center;color:#777;margin-bottom:24px}.event-box{background:#eef7ef;border:1px solid #c6e3ca;border-radius:12px;padding:14px 16px;margin-bottom:22px;text-align:center;font-weight:700;color:#14592d}
.form-row{margin-bottom:16px}label{display:block;font-weight:700;margin-bottom:6px;color:#333}.required{color:#c33}
input,select{width:100%;height:46px;border:1px solid #ccd6cc;border-radius:10px;padding:0 12px;font-size:16px;background:#fff}
.radio-group{display:flex;gap:16px;flex-wrap:wrap}.radio-item{display:flex;align-items:center;gap:7px;font-size:16px}.radio-item input{width:auto;height:auto}
.line-profile{display:none;align-items:center;gap:12px;background:#f4f4f4;border-radius:12px;padding:12px;margin-bottom:20px}.line-profile img{width:54px;height:54px;border-radius:50%;object-fit:cover}.line-name{font-weight:700;color:#222}.hint{font-size:14px;color:#777;margin-top:6px}.btn{width:100%;height:50px;border:0;border-radius:12px;background:#0b7a35;color:#fff;font-size:18px;font-weight:800;cursor:pointer;margin-top:8px}.btn:disabled{background:#999;cursor:not-allowed}.msg{margin-top:18px;padding:14px;border-radius:12px;text-align:center;font-weight:700;display:none}.msg.ok{background:#edf8ee;color:#14702f}.msg.err{background:#fff0f0;color:#b42323}.success-box{display:none;text-align:center}.success-title{font-size:28px;color:#0b7a35;font-weight:900;margin-bottom:14px}.info-list{text-align:left;background:#f7f7f7;border-radius:12px;padding:16px;margin:18px 0}.info-list div{padding:5px 0;border-bottom:1px solid #e6e6e6}.info-list div:last-child{border-bottom:0}@media(max-width:600px){.wrapper{margin:20px auto;padding:12px}.card{padding:22px 16px}h1{font-size:26px}.radio-group{gap:12px}}
</style>
</head>
<body>
<div class="wrapper"><div class="card">
<h1>培訓課程報名</h1>
<div class="subtitle">動元力國際股份有限公司</div>
<div class="event-box" id="eventBox">課程場次</div>
<div class="line-profile" id="lineProfile"><img id="linePic" src="" alt="LINE頭貼"><div><div class="line-name" id="lineName"></div><div class="hint">已取得 LINE 綁定資料</div></div></div>
<form id="courseForm">
<div class="form-row"><label>姓名 <span class="required">*</span></label><input id="name" required></div>
<div class="form-row"><label>手機號碼 <span class="required">*</span></label><input id="phone" required inputmode="tel"></div>
<div class="form-row"><label>推薦人姓名 <span class="required">*</span></label><input id="referrer" required></div>
<div class="form-row"><label>團隊名稱 <span class="required">*</span></label><select id="team" required><option value="">請選擇團隊</option><option>鼎峰團隊（吳慧貞）</option><option>金鑽團隊（陳國興）</option><option>曹操團隊（曹富程）</option><option>可樂團隊（劉欣蕙）</option><option>幸福團隊（蔡明發）</option><option>太陽團隊（羅德發）</option><option>飛熊團隊（林宜蓁）</option></select></div>
<div class="form-row"><label>用餐習慣 <span class="required">*</span></label><div class="radio-group"><label class="radio-item"><input type="radio" name="meal" value="葷食" required>葷食</label><label class="radio-item"><input type="radio" name="meal" value="素食">素食</label></div></div>
<div class="form-row">
  <label>付款方式 <span class="required">*</span></label>

  <div class="radio-group">
    <label class="radio-item">
      <input type="radio" name="payment" value="現金" required>
      現金
    </label>

    <label class="radio-item">
      <input type="radio" name="payment" value="刷卡">
      刷卡
    </label>

    <label class="radio-item">
      <input type="radio" name="payment" value="轉帳匯款">
      轉帳匯款
    </label>
  </div>
</div>

<div class="form-row" id="paymentDetailRow" style="display:none;">
  <label id="paymentDetailLabel">
    付款資料 <span class="required">*</span>
  </label>

  <input
    id="paymentDetail"
    type="text"
    autocomplete="off"
  >

  <div class="hint" id="paymentDetailHint"></div>
</div><button class="btn" id="submitBtn" type="submit">送出報名</button>
<div class="msg" id="msg"></div>
</form>
<div class="success-box" id="successBox"><div class="success-title">報名成功</div><div class="info-list" id="successInfo"></div><div class="hint">現場報到時，請用 LINE 掃描主辦單位提供的報到 QR Code。</div></div>
</div></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwjITXx86Cl3WOqcB9a4GHl8NKe2JhkNWvCZMvufvzumPEAALTv0XGgPm5wShdR5DN4wA/exec';
const LIFF_ID = '2010516604-MDEUKOcF';

const params = new URLSearchParams(window.location.search);

// =====================================================
// 直接從網址取得場次
// 例如：
// https://forcepower2026.com/course/?event=20261003
// =====================================================
const eventCode = params.get('event') || '';

let lineProfile = {
  displayName: '',
  userId: '',
  pictureUrl: ''
};

const el = id => document.getElementById(id);

  // =====================================================
// 付款方式附加欄位
// 現金：收款人
// 刷卡：卡號末4碼
// 轉帳匯款：帳號末5碼
// =====================================================
const paymentRadios = document.querySelectorAll('input[name="payment"]');

paymentRadios.forEach(radio => {
  radio.addEventListener('change', function(){

    const row = el('paymentDetailRow');
    const label = el('paymentDetailLabel');
    const input = el('paymentDetail');
    const hint = el('paymentDetailHint');

    row.style.display = 'block';

    input.value = '';
    input.required = true;
    input.removeAttribute('maxlength');
    input.removeAttribute('pattern');
    input.removeAttribute('inputmode');

    if(this.value === '現金'){

      label.innerHTML =
        '收款人 <span class="required">*</span>';

      input.placeholder =
        '請輸入收款人姓名';

      hint.textContent =
        '請填寫實際收取現金的人員姓名';

    }

    else if(this.value === '轉帳匯款'){

      label.innerHTML =
        '帳號末5碼 <span class="required">*</span>';

      input.placeholder =
        '請輸入匯款帳號末5碼';

      input.maxLength = 5;
      input.inputMode = 'numeric';
      input.pattern = '[0-9]{5}';

      hint.textContent =
        '請填寫匯款帳號最後5碼';

    }

    else if(this.value === '刷卡'){

      label.innerHTML =
        '卡號末4碼 <span class="required">*</span>';

      input.placeholder =
        '請輸入信用卡末4碼';

      input.maxLength = 4;
      input.inputMode = 'numeric';
      input.pattern = '[0-9]{4}';

      hint.textContent =
        '請填寫本次刷卡信用卡最後4碼';

    }

  });
});

  

function showMsg(text, type) {
  const m = el('msg');
  m.textContent = text;
  m.className = 'msg ' + type;
  m.style.display = 'block';
}

async function api(action, data = {}) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify({
      action,
      ...data
    })
  });

  return await res.json();
}


// =====================================================
// 場次直接讀網址
// 不查 Google Sheet
// 不呼叫 getEvents
// 不呼叫 checkEvent
// =====================================================
function initEvent() {

  if (!eventCode) {
    el('eventBox').textContent = '網址缺少課程場次';
    el('submitBtn').disabled = true;
    return;
  }

  el('eventBox').textContent = '課程場次：' + eventCode;
}


// =====================================================
// LINE 初始化
// 加入防止重複登入機制
// =====================================================
async function initLine() {

  try {

    if (!LIFF_ID || LIFF_ID.includes('請填入')) {
      showMsg('LIFF_ID 尚未設定。', 'err');
      return;
    }

    await liff.init({
      liffId: LIFF_ID
    });


    // -------------------------------------------------
    // 尚未登入
    // -------------------------------------------------
    if (!liff.isLoggedIn()) {

      // 防止一直重複導向登入
      const loginKey = 'course_line_login_attempted';

      if (sessionStorage.getItem(loginKey) === '1') {

        sessionStorage.removeItem(loginKey);

        showMsg(
          'LINE 登入沒有成功，請關閉頁面後重新由 LINE 開啟。',
          'err'
        );

        return;
      }

      sessionStorage.setItem(loginKey, '1');

      // 保留目前完整網址
      // 包含 ?event=20261003
      liff.login({
        redirectUri: window.location.href
      });

      return;
    }


    // -------------------------------------------------
    // 已登入
    // 清除登入防重複標記
    // -------------------------------------------------
    sessionStorage.removeItem('course_line_login_attempted');


    // -------------------------------------------------
    // 取得 LINE 個人資料
    // -------------------------------------------------
    const p = await liff.getProfile();

    lineProfile = {
      displayName: p.displayName || '',
      userId: p.userId || '',
      pictureUrl: p.pictureUrl || ''
    };


    // -------------------------------------------------
    // 顯示 LINE 資料
    // -------------------------------------------------
    el('lineName').textContent = lineProfile.displayName;

    if (lineProfile.pictureUrl) {
      el('linePic').src = lineProfile.pictureUrl;
    }

    el('lineProfile').style.display = 'flex';


  } catch (err) {

    console.error('LINE初始化失敗：', err);

    showMsg(
      'LINE 資料取得失敗，請重新由 LINE 開啟報名頁面。',
      'err'
    );
  }
}


// =====================================================
// 送出報名
// =====================================================
el('courseForm').addEventListener('submit', async e => {

  e.preventDefault();

  if (!eventCode) {
    showMsg('網址沒有指定課程場次，無法報名。', 'err');
    return;
  }

  el('submitBtn').disabled = true;

  showMsg(
    '資料送出中，請稍候...',
    'ok'
  );


  try {

    const meal =
      document.querySelector(
        'input[name="meal"]:checked'
      )?.value || '';

    const payment =
      document.querySelector(
        'input[name="payment"]:checked'
      )?.value || '';


    const r = await api(
      'register',
      {
        event: eventCode,

        name:
          el('name').value.trim(),

        phone:
          el('phone').value.trim(),

        lineName:
          lineProfile.displayName,

        lineUserId:
          lineProfile.userId,

        linePicture:
          lineProfile.pictureUrl,

        referrer:
          el('referrer').value.trim(),

        team:
          el('team').value,

        meal,

        payment,

paymentDetail:
  el('paymentDetail').value.trim()
      }
    );


    if (!r.success) {

      showMsg(
        r.message || '報名失敗',
        'err'
      );

      el('submitBtn').disabled = false;

      return;
    }


    // -------------------------------------------------
    // 報名成功
    // -------------------------------------------------
    el('courseForm').style.display = 'none';


el('successInfo').innerHTML = `
  <div>課程場次：${eventCode}</div>
  <div>姓名：${el('name').value.trim()}</div>
  <div>手機號碼：${el('phone').value.trim()}</div>
  <div>團隊名稱：${el('team').value}</div>
  <div>用餐習慣：${meal}</div>
  <div>付款方式：${payment}</div>
<div>付款方式：${payment}</div>
<div>${
  payment === '現金'
    ? '收款人'
    : payment === '轉帳匯款'
      ? '帳號末5碼'
      : '卡號末4碼'
}：${el('paymentDetail').value.trim()}</div>
<div>付款狀態：${r.data?.paymentStatus || r.paymentStatus || '未付款'}</div>

`;


    el('successBox').style.display = 'block';


  } catch (err) {

    console.error(err);

    showMsg(
      '系統連線失敗，請稍後再試。',
      'err'
    );

    el('submitBtn').disabled = false;
  }

});


// =====================================================
// 頁面初始化
// =====================================================

// 場次立即顯示
initEvent();

// LINE 初始化
initLine();

</script>

  
</body>
</html>
