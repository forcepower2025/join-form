
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課程報名後台｜動元力國際</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Microsoft JhengHei",Arial,sans-serif;background:#f5f7f5;color:#333}.wrap{max-width:1280px;margin:30px auto;padding:16px}h1{text-align:center;color:#0b3d1f;margin-bottom:20px}.toolbar{background:#fff;border-radius:14px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.06);display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:18px}.field label{display:block;font-weight:700;margin-bottom:5px}.field select,.field input{height:40px;border:1px solid #ccc;border-radius:8px;padding:0 10px}.btn{height:40px;border:0;border-radius:8px;background:#0b7a35;color:#fff;padding:0 16px;font-weight:800;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.box{background:#fff;border-radius:14px;padding:16px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.06)}.box b{font-size:28px;color:#0b7a35}.qrBox{text-align:center;background:#fff;padding:16px;border-radius:14px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.06)}.qrBox img{width:180px;height:180px}.tableBox{overflow:auto;background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.06)}table{width:100%;border-collapse:collapse;min-width:1280px}th,td{border-bottom:1px solid #eee;padding:10px;font-size:14px;text-align:left;vertical-align:middle}th{background:#e7f3e8;color:#143d20;position:sticky;top:0}td img.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover}.status{height:34px;border:1px solid #ccc;border-radius:7px;padding:0 8px}.msg{text-align:center;margin:16px;color:#b42323;font-weight:700}@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.toolbar{display:block}.field{margin-bottom:10px}.field select,.field input,.btn{width:100%}}
</style>
</head><body><div class="wrap"><h1>課程報名後台</h1>
<div class="toolbar"><div class="field"><label>管理密碼</label><input type="password" id="adminPassword" placeholder="請輸入密碼"></div><div class="field"><label>課程場次</label><select id="eventSelect"></select></div><div class="field"><label>搜尋</label><input id="keyword" placeholder="姓名/手機/推薦人/團隊"></div><button class="btn" onclick="loadData()">讀取名單</button><button class="btn" onclick="downloadCsv()">下載CSV</button></div>
<div class="summary"><div class="box">總報名<br><b id="total">0</b></div><div class="box">已付款<br><b id="paid">0</b></div><div class="box">已報到<br><b id="checked">0</b></div><div class="box">素食<br><b id="veg">0</b></div></div>
<div class="qrBox"><h3>本場現場報到 QR Code</h3><div id="checkinUrl" style="word-break:break-all;margin:8px 0;color:#666"></div><img id="qrImg" alt="報到QRCode"></div>
<div class="tableBox"><table><thead><tr><th>姓名</th><th>手機號碼</th><th>LINE帳號</th><th>LINE USER ID</th><th>LINE頭貼</th><th>推薦人姓名</th><th>團隊名稱</th><th>用餐習慣</th><th>付款方式</th><th>付款狀態</th><th>報到狀態</th><th>報到時間</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="msg" id="msg"></div>
</div><script>
const GAS_URL='https://script.google.com/macros/s/AKfycbwjITXx86Cl3WOqcB9a4GHl8NKe2JhkNWvCZMvufvzumPEAALTv0XGgPm5wShdR5DN4wA/exec';
const ADMIN_PASSWORD='123456';
let rows=[];const el=id=>document.getElementById(id);
async function api(action,data={}){const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});return await res.json()}
function checkPwd(){return el('adminPassword').value===ADMIN_PASSWORD}
async function init(){const r=await api('getEvents');if(!r.success){el('msg').textContent=r.message||'讀取場次失敗';return}el('eventSelect').innerHTML=r.events.map(e=>`<option value="${e}">${e}</option>`).join('');if(r.events.length)loadData()}
async function loadData(){if(!checkPwd()){el('msg').textContent='管理密碼錯誤';return}el('msg').textContent='讀取中...';const ev=el('eventSelect').value;const r=await api('getRegistrations',{event:ev});if(!r.success){el('msg').textContent=r.message||'讀取失敗';return}rows=r.data||[];render();renderQr();el('msg').textContent=''}
function render(){const k=el('keyword').value.trim();let list=rows.filter(x=>!k||Object.values(x).some(v=>String(v||'').includes(k)));el('total').textContent=rows.length;el('paid').textContent=rows.filter(x=>x.付款狀態==='已付款').length;el('checked').textContent=rows.filter(x=>x.報到狀態==='已報到').length;el('veg').textContent=rows.filter(x=>x.用餐習慣==='素食').length;el('tbody').innerHTML=list.map(x=>`<tr><td>${esc(x.姓名)}</td><td>${esc(x.手機號碼)}</td><td>${esc(x.LINE帳號)}</td><td>${esc(x['LINE USER ID'])}</td><td>${x.LINE頭貼?`<img class="avatar" src="${esc(x.LINE頭貼)}">`:''}</td><td>${esc(x.推薦人姓名)}</td><td>${esc(x.團隊名稱)}</td><td>${esc(x.用餐習慣)}</td><td>${esc(x.付款方式)}</td><td><select class="status" onchange="updatePayment('${escAttr(x['LINE USER ID'])}',this.value)"><option ${x.付款狀態==='未付款'?'selected':''}>未付款</option><option ${x.付款狀態==='已付款'?'selected':''}>已付款</option></select></td><td>${esc(x.報到狀態)}</td><td>${esc(x.報到時間)}</td></tr>`).join('')}
async function updatePayment(userId,status){if(!checkPwd()){alert('管理密碼錯誤');return}const r=await api('updatePayment',{event:el('eventSelect').value,lineUserId:userId,paymentStatus:status});if(!r.success)alert(r.message||'更新失敗');else loadData()}
function renderQr(){const url=location.href.replace(/course_admin\.html.*/,'course_checkin.html?event='+encodeURIComponent(el('eventSelect').value));el('checkinUrl').textContent=url;el('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(url)}
function downloadCsv(){const headers=['姓名','手機號碼','LINE帳號','LINE USER ID','LINE頭貼','推薦人姓名','團隊名稱','用餐習慣','付款方式','付款狀態','報到狀態','報到時間'];let csv=headers.join(',')+'\n'+rows.map(r=>headers.map(h=>'"'+String(r[h]||'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=el('eventSelect').value+'_報名名單.csv';a.click()}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function escAttr(s){return esc(s).replace(/'/g,'&#39;')}
el('keyword').addEventListener('input',render);init();
</script></body></html>
