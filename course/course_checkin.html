
<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>現場報到｜動元力國際</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Microsoft JhengHei",Arial,sans-serif;background:#f6f8f6;color:#333}.wrap{max-width:620px;margin:40px auto;padding:16px}.card{background:#fff;border-radius:18px;padding:32px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}h1{font-size:30px;color:#0b3d1f;margin-bottom:12px}.status{font-size:26px;font-weight:900;margin:18px 0}.ok{color:#0b7a35}.err{color:#b42323}.profile img{width:82px;height:82px;border-radius:50%;object-fit:cover;margin:10px auto}.info{text-align:left;background:#f7f7f7;border-radius:12px;padding:16px;margin-top:18px}.info div{padding:6px 0;border-bottom:1px solid #e5e5e5}.info div:last-child{border-bottom:0}.hint{color:#777;margin-top:14px}</style></head><body><div class="wrap"><div class="card"><h1>課程現場報到</h1><div id="eventBox" class="hint"></div><div id="profile" class="profile"></div><div id="status" class="status">讀取中...</div><div id="info" class="info" style="display:none"></div><div class="hint" id="hint">請勿關閉頁面</div></div></div><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
const GAS_URL='https://script.google.com/macros/s/AKfycbwjITXx86Cl3WOqcB9a4GHl8NKe2JhkNWvCZMvufvzumPEAALTv0XGgPm5wShdR5DN4wA/exec';
const LIFF_ID='2010516604-MDEUKOcF';
const params=new URLSearchParams(location.search);const eventCode=params.get('event')||'';const el=id=>document.getElementById(id);
async function api(action,data={}){const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});return await res.json()}
function setStatus(t,cls){el('status').textContent=t;el('status').className='status '+cls}
async function init(){el('eventBox').textContent='課程場次：'+(eventCode||'未指定');if(!eventCode){setStatus('缺少課程場次','err');return}if(!LIFF_ID||LIFF_ID.includes('請填入')){setStatus('尚未設定 LIFF ID','err');return}try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}const p=await liff.getProfile();el('profile').innerHTML=`<img src="${p.pictureUrl||''}" alt="LINE頭貼"><div>${p.displayName||''}</div>`;const r=await api('checkin',{event:eventCode,lineUserId:p.userId,lineName:p.displayName||'',linePicture:p.pictureUrl||''});if(!r.success){setStatus(r.message||'報到失敗','err');el('hint').textContent='請洽現場工作人員協助';return}setStatus('報到成功','ok');const d=r.data;el('info').style.display='block';el('info').innerHTML=`<div>姓名：${d.姓名||''}</div><div>手機號碼：${d.手機號碼||''}</div><div>團隊名稱：${d.團隊名稱||''}</div><div>用餐習慣：${d.用餐習慣||''}</div><div>付款狀態：${d.付款狀態||''}</div><div>報到時間：${d.報到時間||''}</div>`;el('hint').textContent='報到完成，請出示此畫面給工作人員確認。'}catch(e){setStatus('系統連線失敗','err');el('hint').textContent='請重新掃描或洽工作人員';}}
init();</script></body></html>
