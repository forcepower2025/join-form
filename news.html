.news-inner-title {

}
   
    * {

        padding: 0;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;

    }

    }

    /* ===== 第一層 Header ===== */
    #header-top .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateX(2px);
    }
    
    #header-top {
        position: sticky;
        top: 0;
        z-index: 3000;

        background: #e5e5e5;
        display: flex;
        align-items: center;

    }

    #header-top .left-icon {

    }

    #header-top .logo img {
        max-height: 42px;
        width: auto;
        display: block;
    }

    #header-top .hamburger {

        cursor: pointer;
        line-height: 1;
        user-select: none;
    }

    /* ===== 第二層 主選單 ===== */
    #menu-titles {
        letter-spacing: 1px;
        position: sticky;
        top: 72px;
        z-index: 2900;
        background: #a59e8a;
        backdrop-filter: blur(6px);
        border-top: 1px solid rgba(255,255,255,0.12);
        border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .menu-inner {
        max-width: 1280px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding: 0 20px;
    }

    .menu-item {
        position: relative;
    }

    .menu-title {
        display: block;
        color: #fff;
        font-size: 18px;
        padding: 10px 14px;
        white-space: nowrap;
        transition: background 0.25s ease, color 0.25s ease;
    }

    .menu-title:hover {
        background: rgba(255,255,255,0.08);
    }

    .submenu-list {
        list-style: none;
        position: absolute;
        top: 100%;
        left: 0;
        min-width: 190px;
        background: #a59e8a;
        box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        opacity: 0;
        visibility: hidden;
        transform: translateY(10px);
        transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s ease;
        z-index: 2950;
    }

    .submenu-list li a {
        display: block;
        color: #fff;
        padding: 11px 16px;
        font-size: 18px;
        white-space: nowrap;
        transition: background 0.25s ease;
    }

    .submenu-list li a:hover {
        background: rgba(255,255,255,0.1);
    }

    .menu-item:hover .submenu-list {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    /* ===== 聯絡頁主區塊 ===== */
    .contact-wrapper {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px 20px;
    }

    .page-title {
        text-align: center;
        font-size: 32px;
        color: #333;
        margin-bottom: 30px;
        letter-spacing: 2px;
    }

    .cards {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
    }

    .card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        overflow: hidden;
    }

    .card-header {
        background: #a59e8a;
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        padding: 14px 20px;
        letter-spacing: 1px;
    }

    .card-body {
        padding: 24px;
    }

    .contact-item {
        margin-bottom: 16px;
        font-size: 17px;
        color: #555;
    }

    .contact-item:last-child {
        margin-bottom: 0;
    }

    .contact-item strong {
        display: inline-block;
        min-width: 92px;
        color: #333;
    }

    .map-box {
        border-radius: 12px;
        overflow: hidden;
    }

    .map-box iframe {
        width: 100%;
        height: 420px;
        border: 0;
        display: block;
    }

    .social {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    .social a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 120px;
        height: 48px;
        padding: 0 20px;
        border-radius: 999px;
        background: #f2f2f2;
        color: #333;
        font-size: 16px;
        transition: all 0.25s ease;
    }

    .social a:hover {
        background: #a59e8a;
        color: #fff;
    }

    footer {
        background-color: #f4f4f4;
        padding: 40px 20px;
        text-align: center;
        margin-top: 50px;
    }

    /* ===== 手機選單 ===== */
    @media (max-width: 992px) {
        #header-top {
            height: 64px;
        }

        #menu-titles {
            top: 64px;
        }

        .menu-inner {
            display: none;
            flex-direction: column;
            align-items: stretch;
            gap: 0;
            padding: 0;
        }

        #menu-titles.active .menu-inner {
            display: flex;
        }

        .menu-item {
            width: 100%;
            border-top: 1px solid rgba(255,255,255,0.12);
        }

        .menu-title {
            padding: 14px 18px;
        }

        .submenu-list {
            position: static;
            min-width: auto;
            box-shadow: none;
            opacity: 1;
            visibility: visible;
            transform: none;
            display: none;
        }

        .menu-item.open .submenu-list {
            display: none !important;
        }

        .submenu-list li a {
            padding: 11px 30px;
        }
    }

    @media (max-width: 768px) {
        .contact-wrapper {
            padding: 24px 12px 12px;
        }

        .page-title {
            font-size: 26px;
            margin-bottom: 20px;
        }

        .card-header {
            font-size: 18px;
            padding: 12px 16px;
        }

        .card-body {
            padding: 18px 16px;
        }

        .contact-item {
            font-size: 16px;
        }

        .contact-item strong {
            min-width: 78px;
        }

        .map-box iframe {
            height: 320px;
        }

        .social {
            gap: 12px;
        }

        .social a {
            min-width: calc(50% - 6px);
            font-size: 15px;
        }
    }

       /* ===== 最新公告主區塊 ===== */
    .news-wrapper {
        max-width: 1100px;
        margin: 50px auto;
        padding: 20px;
    }

    .news-list {
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .news-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        padding: 28px;
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 32px;
        align-items: center;
    }

    .news-image-box {
        width: 100%;
        aspect-ratio: 1 / 1.414;
        border-radius: 12px;
        overflow: hidden;
        background: #f1f1f1;
        cursor: pointer;
    }

    .news-image-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
    }

    .news-image-box:hover img {
        transform: scale(1.05);
    }

    .news-no-image {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #999;
        font-size: 18px;
        letter-spacing: 2px;
    }

    .news-content {
        text-align: left;
    }

    .news-date {
        font-size: 16px;
        color: #a59e8a;
        margin-bottom: 12px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .news-text {
        font-size: 20px;
        color: #555;
        line-height: 1.9;
        white-space: pre-line;
        letter-spacing: 1px;
    }

    .empty-news {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        padding: 70px 20px;
        text-align: center;
        font-size: 30px;
        color: #666;
        letter-spacing: 2px;
    }

    .image-modal {
        display: none;
        position: fixed;
        z-index: 99999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.82);
        align-items: center;
        justify-content: center;
        padding: 40px;
    }

    .image-modal.active {
        display: flex;
    }

    .image-modal img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        background: #fff;
    }

    .modal-close {
        position: fixed;
        top: 24px;
        right: 34px;
        color: #fff;
        font-size: 48px;
        font-weight: 300;
        cursor: pointer;
        z-index: 100000;
        line-height: 1;
    }

    .modal-close:hover {
        color: #ddd;
    }

/* ===== 手機 ===== */
@media(max-width:992px){
    .menu-inner{
        display:none;
        flex-direction:column;
    }

    #menu-titles.active .menu-inner{

    .menu-title{

    .empty-news {

        padding: 50px 20px;
    }

    .image-modal {
        padding: 20px;
    }

    .modal-close {
        top: 16px;
        right: 22px;
        font-size: 42px;
    }
}

<script>
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzgH_Dj6v3NgxJlHZD5hyKI9GIYSUt8pFoLFhcGa2aj1cvGV_5YzJ0tiQ8F53amBhLK/exec';

const hamburger = document.getElementById("hamburger");
const menuTitles = document.getElementById("menu-titles");

hamburger.addEventListener("click", function () {
    menuTitles.classList.toggle("active");
});

window.addEventListener('load', loadNews);

async function loadNews() {
    const newsList = document.getElementById('newsList');

    try {
        const response = await fetch(GAS_API_URL + '?action=getNews');
        const result = await response.json();

        if (!result.success) {
            newsList.innerHTML = '<div class="empty-news">目前沒有公告</div>';
            return;
        }

        const newsData = result.data || [];

        if (newsData.length === 0) {
            newsList.innerHTML = '<div class="empty-news">目前沒有公告</div>';
            return;
        }

        newsList.innerHTML = newsData.map(function(item) {
            const imageId = String(item.imageId || '').trim();
            const imageUrl = imageId
                ? 'https://lh3.googleusercontent.com/d/' + imageId + '=s1200'
                : '';

            const imageHtml = imageUrl
                ? '<div class="news-image-box" onclick="openImageModal(\'' + imageUrl + '\')">' +
                    '<img src="' + imageUrl + '" alt="公告圖片">' +
                  '</div>'
                : '<div class="news-image-box">' +
                    '<div class="news-no-image">無圖片</div>' +
                  '</div>';

            return '<div class="news-card">' +
                imageHtml +
                '<div class="news-content">' +
                    '<div class="news-date">' + escapeHtml(item.date) + '</div>' +
                    '<div class="news-text">' + formatNewsContent(item.content) + '</div>' +
                '</div>' +
            '</div>';
        }).join('');

    } catch (error) {
        newsList.innerHTML = '<div class="empty-news">公告載入失敗</div>';
    }
}

function openImageModal(imageUrl) {
    const modal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');

    modalImage.src = imageUrl;
    modal.classList.add('active');
}

function closeImageModal() {
    const modal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');

    modal.classList.remove('active');
    modalImage.src = '';
}

document.getElementById('imageModal').addEventListener('click', function(e) {
    if (e.target.id === 'imageModal') {
        closeImageModal();
    }
});

function formatNewsContent(text) {
    const safeText = escapeHtml(text || '');

    return safeText
        .split('\n')
        .map(function(line) {
            if (line.startsWith('【標題】')) {
                return '<div class="news-inner-title">' + line.replace('【標題】', '') + '</div>';
            }

            return line;
        })
        .join('<br>');
}

function escapeHtml(text) {
    return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}
</script>
